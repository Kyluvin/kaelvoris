<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090b12">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>Kaelvoris Mission Control</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='6' fill='%23ffb800'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='%23090b12' font-weight='bold' font-family='monospace'>H</text></svg>">
	<link rel="stylesheet" href="vendor/vant-index.css">
	<script>
	/* 双主题首帧预设：主 CSS 解析前把主题态写到 <html data-theme>，防首帧闪色（FOUC）。
	   取值优先级：localStorage(gh_mobile.theme) > prefers-color-scheme；auto 时原生暗色系统
	   下也预设暗色（后续 JS 会接管并挂 media 监听）。同时给静态 tabbar 预留安全区底色变量，
	   指纹主题生效前 HTML 先渲染（<body> 前执行）也能取到一致底色。 */
	(function () {
	  var t = "auto";
	  try { t = (JSON.parse(localStorage.getItem("gh_mobile") || "{}").theme) || "auto"; } catch (e) {}
	  var dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
	  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
	  // theme-color 同步预设：状态栏/底部安全区首帧即正确（后续 JS 同步覆盖）
	  var meta = document.querySelector('meta[name="theme-color"]');
	  if (meta) meta.setAttribute("content", dark ? "#090b12" : "#f4f6fa");
	})();
	</script>
<style>
/* ============================================================
   Kaelvoris Mobile v3 — Mission Control 设计系统落地
   深空指挥中心：深海军蓝 + 琥珀遥测 + 等宽精度
   设计令牌单一来源：internal/design/systems/mission-control（tokens.css）
   详见 doc/mobile-design-system.md
   ============================================================ */
:root {
  /* ===== 亮色主题（浅色白昼）=====
     mission-control 深空色系的亮色投影：命令中心语义不变，表面翻转为纸白。 */
  /* 表面 */
  --bg: #f4f6fa;              /* 页面底：云灰白 */
  --surface: #ffffff;         /* 卡片/面板层 */
  --surface-warm: #eaeef5;    /* 浮起层：输入框、气泡底、次按钮 */
  --fg: #17202d;
  --fg-2: #38434f;
  --muted: #6b7686;
  --meta: #2563eb;            /* 链接/机读辅助蓝 */
  --border: #c6cfdd;
  --border-soft: #dde3ec;
  /* 遥测数据色：亮色下降饱和/加深保证白底可读 */
  --data-amber: #b77900;      /* 主遥测（琥珀加深） */
  --data-cyan: #0794c9;       /* 副遥测（青加深） */
  --success: #0f9960;
  --warn: #b77900;
  --danger: #e0324b;
  --on-accent: #ffffff;       /* 强调色（琥珀/青）上的文字 */
  --overlay: rgba(15, 23, 42, .45);       /* 遮罩 */
  --header-bg: rgba(244, 246, 250, .88);  /* 顶部栏/底栏毛玻璃底 */
  --tabbar-bg: rgba(244, 246, 250, .92);
  --toast-bg: rgba(255, 255, 255, .97);
  --shadow-color: rgba(15, 23, 42, .16);  /* 阴影基色 */
  --amber-tint-bg: rgba(183, 121, 0, .10);  /* 琥珀淡底/细边 */
  --amber-tint-border: rgba(183, 121, 0, .32);
  --cyan-tint-bg: rgba(7, 148, 201, .10);   /* 青淡底/细边 */
  --cyan-tint-border: rgba(7, 148, 201, .32);
  --success-tint-bg: rgba(15, 153, 96, .10);
  --danger-tint-bg: rgba(224, 50, 75, .10);
  --danger-tint-border: rgba(224, 50, 75, .38);
  --muted-tint-bg: rgba(107, 118, 134, .10); /* 灰徽标淡底 */
  --muted-tint-border: rgba(107, 118, 134, .28);
  --menu-ink: #090b12;       /* 深色内联菜单（验证按钮底色，双主题恒定） */
  --font-display: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-sm: 4px;           /* 指挥中心反圆润：>4px 禁用 */
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-pill: 2px;
  --header-h: 54px;
  --tabbar-h: 58px;
  --motion-fast: 100ms;
  --motion-base: 150ms;
  --motion-slow: 300ms;
  --ease-out: cubic-bezier(0, 0, .2, 1);
}
/* ===== 暗色主题（原 mission-control 深空指挥中心令牌，语义逐字保留） =====
   经 <html data-theme="dark"> 生效；双主题仅覆盖表面/遥测/语义色，字体/圆角/动效共用。 */
:root[data-theme=dark] {
  /* 表面（mission-control tokens.css 深空层） */
  --bg: #090b12;              /* 页面底：深空黑 */
  --surface: #121722;         /* 卡片/面板层 */
  --surface-warm: #1b2233;    /* 浮起层：输入框、气泡底、次按钮 */
  --fg: #f8fafc;
  --fg-2: #cbd5e1;
  --muted: #94a3b8;
  --meta: #60a5fa;            /* 链接/机读辅助蓝（tokens.css 原义） */
  --border: #2a3447;
  --border-soft: #1d2636;
  /* 遥测数据色（DESIGN.md §2 Data Palette） */
  --data-amber: #ffb800;      /* 主遥测：关键数值/主按钮/选中态 */
  --data-cyan: #00d4ff;       /* 副遥测：健康/活跃/流式 */
  --success: #26de81;
  --warn: #ffb800;            /* mission-control 中 warn=amber 同源 */
  --danger: #ff4757;
  --on-accent: var(--bg);     /* 琥珀上的文字 = 深空黑（原设计 color: var(--bg)） */
  --overlay: rgba(0, 0, 0, .7);           /* Vant 遮罩原值 */
  --header-bg: rgba(9, 11, 18, .88);
  --tabbar-bg: rgba(9, 11, 18, .92);
  --toast-bg: rgba(18, 23, 34, .97);
  --shadow-color: rgba(0, 0, 0, .35);
  --amber-tint-bg: rgba(255, 184, 0, .10);
  --amber-tint-border: rgba(255, 184, 0, .32);
  --cyan-tint-bg: rgba(0, 212, 255, .09);
  --cyan-tint-border: rgba(0, 212, 255, .31);
  --success-tint-bg: rgba(38, 222, 129, .10);
  --danger-tint-bg: rgba(255, 71, 87, .10);
  --danger-tint-border: rgba(255, 71, 87, .40);
  --muted-tint-bg: rgba(148, 163, 184, .10);
  --muted-tint-border: rgba(148, 163, 184, .25);
  --menu-ink: #090b12;
}
/* 亮色下色阶反转项（琥珀实底上文字、on-accent 反白、深色菜单文字） */
:root:not([data-theme=dark]) .logo,
:root:not([data-theme=dark]) .fab,
:root:not([data-theme=dark]) .login-logo,
:root:not([data-theme=dark]) .btn-primary,
:root:not([data-theme=dark]) .avatar,
:root:not([data-theme=dark]) .send-btn,
:root:not([data-theme=dark]) .swipe-pin:not(.un),
:root:not([data-theme=dark]) .fchip.on,
:root:not([data-theme=dark]) .seg-item.on,
:root:not([data-theme=dark]) .st-chip.st-chip-btn.sel,
:root:not([data-theme=dark]) .node-chip.sel,
:root:not([data-theme=dark]) .ask-btn.yes,
	:root:not([data-theme=dark]) .dv-act.primary,
	:root:not([data-theme=dark]) .swipe-del,
	:root:not([data-theme=dark]) .tab-badge,
	:root:not([data-theme=dark]) .seg-badge,
	:root:not([data-theme=dark]) .bubble.user { color: var(--on-accent); }
/* 亮色强调按钮投影：原固定 rgba(255,184,0,…) 阴影改令牌（dark 同源原始值） */
/* Vant 变量覆写（语义变量跟随主题令牌，双主题自动生效） */
:root:root {
  --van-primary-color: var(--data-cyan);
  --van-text-color: var(--fg);
  --van-text-color-2: var(--fg-2);
  --van-text-color-3: var(--muted);
  --van-border-color: var(--border);
  --van-background: var(--bg);
  --van-background-2: var(--surface);
  --van-popup-background: var(--surface);
  --van-nav-bar-background: transparent;
  --van-nav-bar-title-text-color: var(--fg);
  --van-nav-bar-icon-color: var(--fg-2);
  --van-nav-bar-arrow-size: 20px;
  --van-cell-background: transparent;
  --van-cell-text-color: var(--fg);
  --van-cell-label-color: var(--muted);
  --van-cell-value-color: var(--fg-2);
  --van-cell-border-color: var(--border-soft);
  --van-field-label-color: var(--muted);
  --van-field-input-text-color: var(--fg);
  --van-field-placeholder-text-color: var(--muted);
  --van-button-primary-background: var(--data-cyan);
  --van-button-primary-border-color: var(--data-cyan);
  --van-radio-checked-icon-color: var(--data-cyan);
  --van-toast-background: var(--toast-bg);
  --van-toast-text-color: var(--fg);
  --van-dialog-background: var(--surface);
  --van-dialog-header-text-color: var(--fg);
  --van-dialog-message-text-color: var(--fg-2);
  --van-dialog-confirm-button-text-color: var(--data-cyan);
  --van-empty-description-color: var(--muted);
  --van-popup-round-radius: 4px;
  --van-pull-refresh-head-text-color: var(--muted);
  --van-notify-text-color: var(--fg);
  --van-overlay-background: var(--overlay);
}
/* 任务终态通知横幅：状态色边条（色彩即状态） + 等宽机器语义前缀（面板色随主题） */
.van-notify {
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: 4px;
  font-family: var(--font-mono);
  letter-spacing: .04em;
  backdrop-filter: blur(8px);
}
.van-notify.is-done { border-left-color: var(--data-cyan); }
.van-notify.is-failed { border-left-color: var(--danger); }
.van-notify.is-canceled { border-left-color: var(--muted); }
* { -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(900px 420px at 82% -6%, var(--cyan-tint-bg), transparent 58%),
    radial-gradient(1100px 500px at 12% 112%, var(--amber-tint-bg), transparent 60%),
    var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  /* 双向 none：横向也拦（边缘滑不触发历史导航），纵向防橡皮筋露底 */
  overscroll-behavior: none;
}
.mono { font-family: var(--font-mono); }
button, input, textarea { font-family: inherit; }

/* ---------- 顶部状态栏（指挥台标头） ---------- */
.app-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: calc(env(safe-area-inset-top)) 16px 0;
  height: var(--header-h); box-sizing: content-box;
  display: flex; align-items: center; gap: 10px;
  background: var(--header-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-soft);
}
.logo {
  width: 32px; height: 32px; border-radius: 4px; flex-shrink: 0;
  background: var(--data-amber); color: var(--bg);
  font-weight: 800; font-size: 16px; font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
}
.hdr-title {
  font-size: 13px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--fg);
}
.hdr-sub {
  font-size: 10px; color: var(--data-amber); font-weight: 600;
  margin-left: 7px; letter-spacing: .1em; text-transform: uppercase;
  font-family: var(--font-mono);
}
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
/* 信号条：WS 连接状态（mission-control Signal Strength Indicator） */
.sig { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.sig i { width: 3px; border-radius: 1px; background: var(--border); transition: background var(--motion-base) var(--ease-out); }
.sig i:nth-child(1) { height: 4px; }
.sig i:nth-child(2) { height: 8px; }
.sig i:nth-child(3) { height: 11px; }
.sig i:nth-child(4) { height: 14px; }
.sig.on i { background: var(--data-cyan); }
.sig.off i { background: var(--border); }
.hdr-user {
  width: 30px; height: 30px; border-radius: 4px; flex-shrink: 0;
  background: var(--surface-warm); border: 1px solid var(--border);
  color: var(--data-amber); font-size: 13px; font-weight: 700; font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
}

/* ---------- 页面容器 ---------- */
.page {
  padding: calc(var(--header-h) + env(safe-area-inset-top) + 10px) 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
  min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
}

/* ---------- 小节标题（panel-title 规范） ---------- */
.sec-title {
  margin: 16px 16px 8px; font-size: 10.5px; font-weight: 600; color: var(--muted);
  letter-spacing: .1em; text-transform: uppercase; font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: space-between;
}

/* ---------- 清理会话按钮（会话列表页；遥测琥珀 = 主操作色） ---------- */
.cleanup-btn {
  padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface-warm); color: var(--data-amber);
  font-size: 11px; font-family: var(--font-mono); cursor: pointer;
  letter-spacing: .02em; text-transform: none; white-space: nowrap; flex-shrink: 0;
}
.cleanup-btn:disabled { opacity: .55; cursor: default; }
.cleanup-btn:active { filter: brightness(1.15); }

/* ---------- 清空/总结按钮组（会话列表页；琥珀系主操作 + 危险红清空） ---------- */
	.cleanup-actions { display: inline-flex; gap: 5px; flex-shrink: 0; }
	.cleanup-btn.ca-sum { color: var(--data-cyan); }
	.cleanup-btn.ca-danger { color: var(--danger); }
	.clear-hint {
	  margin: 0 16px 10px; padding: 8px 12px; border-radius: var(--radius-sm);
	  border: 1px dashed var(--border); background: var(--surface-warm);
	  font-size: 11px; color: var(--muted); line-height: 1.6; font-family: var(--font-mono);
	}

/* ---------- 清理结果卡片（会话列表页顶部） ---------- */
	.cleanup-result {
  margin: 0 16px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); overflow: hidden;
}
.cr-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; font-size: 11.5px; color: var(--data-amber);
  font-family: var(--font-mono); background: var(--surface-warm); cursor: pointer;
}
.cr-close { color: var(--muted); }
.cr-body { max-height: 220px; overflow-y: auto; padding: 4px 0; }
.cr-line { padding: 5px 12px; border-top: 1px solid var(--border-soft); }
.cr-title { display: block; font-size: 12px; color: var(--fg-2); }
.cr-line2 { display: block; font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); margin-top: 1px; word-break: break-all; }

	/* ---------- 会话历史加载失败卡（聊天页：空镜像 + 节点离线时的重试入口） ---------- */
	.hist-fail {
	  margin: 18px 16px 8px; padding: 14px 14px 12px;
	  border: 1px solid var(--border); border-radius: var(--radius-md);
	  background: var(--surface);
	}
	.hist-fail .hf-tag {
	  font-size: 9.5px; font-weight: 700; letter-spacing: .08em;
	  text-transform: uppercase; color: var(--warn); font-family: var(--font-mono);
	}
	.hist-fail .hf-text { margin-top: 6px; font-size: 12px; line-height: 1.6; color: var(--fg-2); }
	.hist-fail .hf-retry {
	  margin-top: 10px; padding: 5px 14px; border-radius: var(--radius-sm);
	  border: 1px solid var(--border); background: var(--surface-warm);
	  color: var(--data-cyan); font-size: 11px; font-family: var(--font-mono); cursor: pointer;
	}
	.hist-fail .hf-retry:active { filter: brightness(1.2); }

	/* Vant PullRefresh 修正：head 层为 absolute+translateY(-100%)，默认悬在容器上方 50px，
   恰好覆盖任务页筛选 chips 行并拦截触摸命中 → chips 点击无响应。
   head 仅作下拉状态展示（无交互），禁用其指针事件即修复；拉动手势不受影响。 */
.van-pull-refresh__head { pointer-events: none; }

/* ---------- 筛选 chips ---------- */
.filter-row { display: flex; gap: 6px; padding: 4px 16px 12px; overflow-x: auto; scrollbar-width: none; position: relative; z-index: 1; }
.filter-row::-webkit-scrollbar { display: none; }
.fchip {
  padding: 5px 11px; border-radius: var(--radius-pill); font-size: 11px;
  color: var(--muted); border: 1px solid var(--border);
  background: var(--surface); white-space: nowrap; flex-shrink: 0;
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em;
  transition: color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), background var(--motion-fast) var(--ease-out);
  cursor: pointer;
}
		.fchip.on { color: var(--on-accent); background: var(--data-amber); border-color: var(--data-amber); font-weight: 700; }
.fchip .cnt { opacity: .7; margin-left: 3px; }

/* ---------- 任务卡（telemetry panel） ---------- */
.tcard {
  position: relative; margin: 0 16px 8px; padding: 11px 13px 11px 16px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
  transition: border-color var(--motion-fast) var(--ease-out);
}
	.tcard:active { border-color: var(--data-amber); }
		.tcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border); }
	.tcard.subtask { margin-left: 26px; }
	.tcard.st-running::before { background: var(--data-cyan); box-shadow: 0 0 8px var(--data-cyan); }
	.tcard.st-pending::before { background: var(--warn); }
	.tcard.st-done::before { background: var(--success); }
	.tcard.st-failed::before { background: var(--danger); }
	.tcard.st-canceled::before { background: var(--muted); }
.tcard-text { flex: 1; font-weight: 600; font-size: 14px; line-height: 1.45; word-break: break-all; }
.tcard-meta {
  display: flex; align-items: center; gap: 7px; margin-top: 7px; flex-wrap: wrap;
  font-size: 10.5px; color: var(--muted); font-family: var(--font-mono);
}
.tcard-sum {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-soft);
  font-size: 12px; color: var(--fg-2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tcard-sum.is-err { color: var(--danger); }
/* 状态徽标：mission-control Status Badge（uppercase 微型徽标） */
.st-chip {
  display: inline-block; padding: 2px 7px; border-radius: 2px;
  font-size: 9.5px; font-weight: 700; line-height: 1.5;
  text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-mono);
}
	.st-chip.sc-pending { color: var(--warn); background: var(--amber-tint-bg); border: 1px solid var(--amber-tint-border); }
	.st-chip.sc-running { color: var(--data-cyan); background: var(--cyan-tint-bg); border: 1px solid var(--cyan-tint-border); }
	.st-chip.sc-done { color: var(--success); background: var(--success-tint-bg); border: 1px solid var(--cyan-tint-border); }
	.st-chip.sc-failed { color: var(--danger); background: var(--danger-tint-bg); border: 1px solid var(--danger-tint-border); }
			.st-chip.sc-blocked { color: var(--warn); background: var(--amber-tint-bg); border: 1px solid var(--amber-tint-border); }
			/* 规划板执行日志行（runLog 最新一条：耗时 + 改动文件数） */
		.st-chip.sc-canceled { color: var(--muted); background: var(--muted-tint-bg); border: 1px solid var(--muted-tint-border); }
	/* 状态徽章可点：点击 = 按该状态筛选任务列表（高亮 = 筛选生效，再点恢复全部） */
	.st-chip.st-chip-btn { cursor: pointer; }
	.st-chip.st-chip-btn:active { opacity: .7; }
		.st-chip.st-chip-btn.sel {

		/* 挂载点在 .page 外层（见模板注释）：fixed 真固定视口；支持触摸拖动换位（JS 注入 left/top） */
		.fab {
		  position: fixed; right: 16px;
		  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
		  touch-action: none; /* 允许 JS 拖动：touchmove preventDefault 生效，不触发页面滚动 */
		  width: 54px; height: 54px; border-radius: 50%; border: none; z-index: 90;

	/* 核实刷新小按钮：FAB 上方副操作（节点真实状态回核任务/会话/PC 端状态）。

		.fab-verify {

	.fab-verify.busy { color: var(--data-cyan); opacity: .75; }
		.fab-verify .van-icon { animation: verifySpin 1s linear infinite; }
		@keyframes verifySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ---------- 登录页（auth console） ---------- */
	.login {

	  min-height: calc(100vh - var(--kb-h, 0px)); min-height: calc(100dvh - var(--kb-h, 0px));

		  width: 100%; min-height: 46px; padding: 10px 12px; font-size: 13px; font-weight: 700;
		  color: var(--on-accent); background: var(--data-amber);
		  border: 1px solid var(--data-amber); border-radius: var(--radius-md); cursor: pointer;
		}
		.rm-exec-btn:active { filter: brightness(1.1); }
			.rm-exec-btn:disabled { opacity: .45; }
			.rm-exec-btn.ghost {
			  color: var(--fg); background: var(--surface); border-color: var(--border);
			}
			.rm-exec-btn.ghost:active { background: var(--surface-warm); filter: none; }
		/* 空态 / 骨架屏 */
		.rm-empty { padding: 44px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
		.rm-empty-logo { font-size: 38px; }
		.rm-empty-title { font-size: 14px; font-weight: 600; color: var(--fg); }
		.rm-empty-desc { font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 300px; }
		.rm-empty-cta { margin-top: 8px; padding: 12px 18px; font-size: 13px; font-weight: 700; color: var(--on-accent); background: var(--data-amber); border: 1px solid var(--data-amber); border-radius: var(--radius-md); min-height: 44px; }
		.rm-empty-cta:active { filter: brightness(1.1); }
		.rm-empty-cta:disabled { opacity: .45; }
		.rm-sk {

		  padding: 12px; display: flex; flex-direction: column; gap: 8px;
		}
		.rm-sk i { display: block; height: 10px; border-radius: 4px; background: linear-gradient(90deg, var(--muted-tint-bg), var(--amber-tint-bg), var(--muted-tint-bg)); background-size: 200% 100%; animation: rm-shimmer 1.2s linear infinite; }
		@keyframes rm-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
		/* 详情底部 sheet（三段式：头部固定 + body 滚动 + 底部操作常驻；操作按钮绝不与内容重叠；
		   z-index 高于 tabbar 100、低于 Vant Dialog/Notify 2000+；挂在 .page 外层避免 transform 相对化） */
		.rm-sheet-mask { position: fixed; inset: 0; background: var(--overlay); z-index: 190; animation: rmFade .2s var(--ease-out); }
		.rm-sheet {
		  position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
		  display: flex; flex-direction: column; max-height: 88vh;
		  background: var(--surface); border-radius: 10px 10px 0 0;
		  box-shadow: 0 8px 32px rgba(0,0,0,.35); padding: 0;
		  animation: rmSheetIn .22s var(--ease-out);
		}
		.rm-sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 10px auto 0; flex-shrink: 0; }
		.rm-sheet-head {
		  flex-shrink: 0; display: flex; align-items: flex-start; gap: 10px;
		  padding: 10px 16px 8px; border-bottom: 1px solid var(--border-soft);
		}
		.rm-sheet-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--fg); line-height: 1.5; }
		.rm-sheet-close { flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--radius-md); border: 1px solid var(--border-soft); background: var(--surface-warm); color: var(--fg-2); font-size: 14px; cursor: pointer; }
		.rm-sheet-body { flex: 1; overflow-y: auto; min-height: 0; padding: 12px 16px; }
		.rm-sheet-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
		.rm-detail-block { margin-top: 12px; }
		.rm-detail-label {
		  font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--muted);
		  text-transform: uppercase; font-family: var(--font-mono); margin-bottom: 4px;
		}
		.rm-detail-text {
		  font-size: 13px; color: var(--fg); line-height: 1.75; word-break: break-word;
		  background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 10px 12px;
		}
		.rm-detail-text.review { color: var(--data-cyan); background: var(--cyan-tint-bg); border-color: var(--cyan-tint-border); }
		.rm-detail-text.ok { color: var(--success); background: var(--success-tint-bg); border-color: var(--border-soft); }
		.rm-detail-text.err { color: var(--danger); background: var(--danger-tint-bg); border-color: var(--danger-tint-border); }
		.rm-detail-text.run { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
		.rm-runlog-hist { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border-soft); font-size: 11px; }
		.rm-runlog-hist:last-child { border-bottom: none; }
		.rm-runlog-outcome { font-weight: 700; font-family: var(--font-mono); }
		.rm-runlog-outcome.done { color: var(--success); }
		.rm-runlog-outcome.blocked { color: var(--warn); }
		.rm-runlog-outcome.failed { color: var(--danger); }
		.rm-runlog-dur { font-family: var(--font-mono); color: var(--muted); font-size: 10px; }
		.rm-runlog-sum { flex: 1; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.rm-detail-foot {
		  flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap;
		  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
		  border-top: 1px solid var(--border-soft);
		}
		.rm-detail-foot .rm-mini-btn { min-height: 36px; }
		.rm-detail-foot .rm-mini-btn.primary { color: var(--on-accent); background: var(--data-amber); border-color: var(--data-amber); }
		.rm-detail-foot .rm-mini-btn.danger { color: var(--danger); border-color: var(--danger-tint-border); }
		@keyframes rmFade { from { opacity: 0; } to { opacity: 1; } }
		@keyframes rmSheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
		/* 旧版 tab 徽标定位已废弃：新徽标见 UX Plus 段（.tab-badge 绝对定位于 tab 图标右上） */

/* ---------- 聊天页（comm link） ---------- */
	.page-chat { display: flex; flex-direction: column; height: calc(100vh - var(--kb-h, 0px)); height: calc(100dvh - var(--kb-h, 0px)); padding: 0; }
.chat-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;

}

}

	  flex-shrink: 0; padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer;

	  display: inline-flex; align-items: center; gap: 4px;

	.chat-body { flex: 1; overflow-y: auto; padding: 14px 0 10px; -webkit-overflow-scrolling: touch; position: relative; }
.chat-foot { flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); background: var(--bg); }

/* todos 清单（checklist telemetry） */
.todos {
  margin: 2px 16px 12px; background: var(--surface);
  border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden;
}
.todos-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 13px;
  font-size: 10.5px; font-weight: 700; color: var(--data-amber); cursor: pointer;
  text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-mono);
}
.todos-head .arr { margin-left: auto; transition: transform var(--motion-base) var(--ease-out); color: var(--muted); }
.todos-head .arr.open { transform: rotate(180deg); }
.todos-prog { height: 3px; background: var(--border-soft); }
.todos-prog i { display: block; height: 100%; background: var(--data-cyan); border-radius: 0 2px 2px 0; transition: width 300ms var(--ease-out); }
.todos-body { padding: 2px 13px 10px; }
.todo-item { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--fg-2); padding: 4px 0; line-height: 1.5; }
.todo-done { color: var(--muted); text-decoration: line-through; }

	/* 消息气泡（comm transcript）：用户/助手区分配色，非对称圆角 + 头像/时间戳行 */
	.msg { display: flex; align-items: flex-end; gap: 7px; margin: 0 16px 10px; }
	.msg.user { justify-content: flex-end; }
	.m-avatar {
	  width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
	  display: flex; align-items: center; justify-content: center;
	  font-size: 10px; font-weight: 700; user-select: none;
	}
	.m-avatar.bot { background: var(--cyan-tint-bg); color: var(--data-cyan); border: 1px solid var(--cyan-tint-border); }
	.m-avatar.user { background: var(--surface-warm); color: var(--fg-2); border: 1px solid var(--border-soft); }
	.m-time { font-size: 10px; color: var(--muted); font-family: var(--font-mono); flex-shrink: 0; margin-bottom: 3px; }
	.bubble {
  max-width: 84%; padding: 9px 13px; border-radius: 6px;
  font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
}
.bubble.bot { background: var(--surface-warm); border: 1px solid var(--border-soft); border-bottom-left-radius: 2px; }
	.bubble.user { background: var(--data-amber); color: var(--on-accent); border-bottom-right-radius: 2px; font-weight: 500; }
	.bubble.ask { background: var(--amber-tint-bg); border: 1px solid var(--amber-tint-border); color: var(--data-amber); border-bottom-left-radius: 2px; }
	.bubble.ok { border-color: var(--cyan-tint-border); }
	.bubble.err { background: var(--danger-tint-bg); border: 1px solid var(--danger-tint-border); color: var(--danger); }
	.streaming::after { content: '▍'; color: var(--data-cyan); animation: blink 1s steps(2) infinite; }
	@keyframes blink { 50% { opacity: 0; } }
	/* 气泡内 Markdown 渲染（bot/ok/err 气泡；user 气泡保持纯文本） */
	.bubble-md { display: block; }
	.bubble-md .md-h { color: inherit; font-weight: 700; margin: .6em 0 .3em; line-height: 1.4; }
	.bubble-md h3.md-h { font-size: 15.5px; }
	.bubble-md h4.md-h { font-size: 14.5px; }
	.bubble-md h5.md-h { font-size: 14px; }
	.bubble-md .md-p { margin: .35em 0; line-height: 1.65; }
	.bubble-md .md-p:first-child { margin-top: 0; }
	.bubble-md .md-p:last-child { margin-bottom: 0; }
	.bubble-md ul, .bubble-md ol { margin: .35em 0; padding-left: 20px; }
	.bubble-md li { margin: .15em 0; }
	.bubble-md .md-quote {
	  margin: .5em 0; padding: 6px 10px; border-left: 3px solid var(--data-amber);
		  background: var(--amber-tint-bg); border-radius: 0 4px 4px 0; color: inherit; opacity: .85;
	}
	/* 代码块卡片：深色高亮主题（双主题恒定深空底）+ 语言标签 + 复制按钮 */
	.bubble-md .md-code {
	  margin: .5em 0; background: #16181D; border: 1px solid rgba(255,255,255,.08);
	  border-radius: 4px; overflow: hidden;
	}
	.bubble-md .md-code-head {
	  display: flex; align-items: center; padding: 4px 9px;
	  background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07);
	}
	.bubble-md .md-code-lang { font-family: var(--font-mono); font-size: 9.5px; color: #8B93A7; text-transform: uppercase; letter-spacing: .06em; }
	.bubble-md .md-code-copy {
	  margin-left: auto; border: none; background: none; cursor: pointer;
	  font-family: var(--font-body); font-size: 10px; color: #A9B1C3; padding: 2px 8px; border-radius: 3px;
	}
	.bubble-md .md-code-copy:active { background: rgba(255,255,255,.10); color: #E8EAF0; }
	.bubble-md .md-code .md-pre { margin: 0; border: none; border-radius: 0; background: transparent; }
	/* 代码高亮 token（Nord 深空系，与桌面端/管理端一致） */
	.bubble-md .hl-kw { color: #81A1C1; }
	.bubble-md .hl-str { color: #A3BE8C; }
	.bubble-md .hl-cmt { color: #6A7387; font-style: italic; }
	.bubble-md .hl-num { color: #B48EAD; }
	.bubble-md .hl-add { color: #A3BE8C; }
	.bubble-md .hl-del { color: #BF616A; }
	.bubble-md .hl-hunk { color: #88C0D0; }
	.bubble-md .md-pre {
	  margin: .5em 0; padding: 9px 11px; background: var(--bg); border: 1px solid var(--border);
	  border-radius: 4px; overflow-x: auto; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6;
	  color: #D8DEE9; white-space: pre; tab-size: 4;
	}
		.bubble-md code { font-family: var(--font-mono); font-size: 12px; background: var(--cyan-tint-bg); padding: 1px 5px; border-radius: 3px; color: var(--data-cyan); }
		.bubble-md .md-pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
	.bubble-md .md-hr { border: none; border-top: 1px solid var(--border); margin: .7em 0; }
	/* 表格：长表格容器内横向滚动，禁止撑破气泡/页面（验收：无横向溢出） */
	.bubble-md .md-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
	.bubble-md table { border-collapse: collapse; margin: .5em 0; max-width: 100%; table-layout: fixed; font-size: 12.5px; }
	.bubble-md th, .bubble-md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; word-break: break-word; overflow-wrap: anywhere; }
	.bubble-md th { background: var(--surface); font-weight: 700; }
	.bubble-md a { color: var(--data-cyan); }
	.bubble-md img { max-width: 100%; border-radius: 4px; }
	/* err 气泡内 Markdown：代码/链接沿用错误色系 */
		.bubble.err .bubble-md code { background: var(--danger-tint-bg); color: var(--danger); }
		.bubble.err .bubble-md .md-pre { color: var(--danger); background: var(--danger-tint-bg); border-color: var(--danger-tint-border); }
		.bubble.err .bubble-md .md-code { background: var(--danger-tint-bg); border-color: var(--danger-tint-border); }
		.bubble.err .bubble-md a { color: var(--danger); }
	.ev-tool {
  display: flex; gap: 8px; align-items: flex-start; margin: 0 16px 9px; padding: 7px 11px;
  font-family: var(--font-mono); font-size: 10.5px; line-height: 1.55; color: var(--muted);
	  background: var(--cyan-tint-bg); border-left: 2px solid var(--data-cyan);
	  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; word-break: break-all;
	}
.ev-tool .van-icon { flex-shrink: 0; margin-top: 1px; color: var(--data-cyan); }
	.ev-error {
	  margin: 0 16px 9px; padding: 7px 11px; font-size: 12px; line-height: 1.55;
		  color: var(--danger); background: var(--danger-tint-bg);
		  border-left: 2px solid var(--danger); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; word-break: break-all;
		}
	.ev-progress {
	  /* 长任务心跳卡（R2）：待办进行中提示，琥珀遥测色 = 关键数据语义 */
	  margin: 0 16px 9px; padding: 7px 11px; font-size: 12px; line-height: 1.55;
		  color: var(--data-amber); background: rgba(255, 184, 0, .07);
		  border-left: 2px solid var(--data-amber); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; word-break: break-all;
		}
	.typing { display: inline-flex; gap: 4px; align-items: center; margin-left: 4px; }
.typing i { width: 5px; height: 5px; border-radius: 1px; background: var(--muted); animation: tdot 1.2s infinite; }
	.typing i:nth-child(2) { animation-delay: .18s; }
	.typing i:nth-child(3) { animation-delay: .24s; }
	@keyframes tdot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

	/* AI 会话分析卡（复盘报告：analyze.done 事件渲染 / 重拉历史兼容） */
	.analyze-card {
	  margin: 0 16px 10px; padding: 11px 13px;
		  background: var(--cyan-tint-bg); border: 1px solid var(--cyan-tint-border);
		  border-left: 3px solid var(--data-cyan); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
	}
	.analyze-tag {
	  display: inline-flex; align-items: center; gap: 5px; margin-bottom: 7px;
	  font-size: 10px; font-weight: 800; color: var(--data-cyan);
	  text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-mono);
	}
	.analyze-body { font-size: 12.5px; color: var(--fg-2); line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
	.analyze-loading { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); font-family: var(--font-mono); padding: 2px 0 6px; }
	.analyze-fail { margin: 0 16px 10px; padding: 7px 11px; font-size: 12px; line-height: 1.55; color: var(--danger); background: var(--danger-tint-bg); border-left: 2px solid var(--danger); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; word-break: break-all; }

	/* 任务完成「文件变更」卡片（turn_diff：默认折叠，点开看清单与 diff） */
	.td-card {
		  margin: 0 16px 10px; background: var(--success-tint-bg);
		  border: 1px solid var(--border-soft); border-left: 3px solid var(--success);
	  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; overflow: hidden;
	}
	.td-head {
	  display: flex; align-items: center; gap: 6px; padding: 9px 12px;
	  font-size: 11px; font-weight: 800; color: var(--fg-2); cursor: pointer;
	  text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-mono);
	  user-select: none;
	}
	.td-card .td-arrow { margin-left: auto; font-size: 10px; color: var(--muted); transition: transform .15s; }
	.td-card.open .td-arrow-open { transform: rotate(180deg); }
	.td-stats { display: inline-flex; gap: 5px; margin-left: 4px; }
	.td-badge { font-size: 9.5px; padding: 1px 6px; border-radius: 999px; font-family: var(--font-mono); }
		.td-badge.add { background: var(--success-tint-bg); color: var(--success); }
		.td-badge.mod { background: var(--cyan-tint-bg); color: var(--data-cyan); }
		.td-badge.del { background: var(--danger-tint-bg); color: var(--danger); }
	.td-body { display: none; padding: 2px 12px 10px; border-top: 1px solid var(--border-soft); max-height: 46vh; overflow-y: auto; }
	.td-card.open .td-body { display: block; }
	.td-entry { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); padding: 1.5px 0; word-break: break-all; }
		.td-entry.add { color: var(--success); }
		.td-entry.mod { color: var(--data-cyan); }
		.td-entry.del { color: var(--danger); }
	.td-diff-head { font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding: 8px 0 3px; border-bottom: 1px dashed var(--border-soft); margin-bottom: 2px; }
	.td-line { font-family: var(--font-mono); font-size: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; padding: 0 2px; }
		.td-line.add { color: var(--success); background: var(--success-tint-bg); }
		.td-line.del { color: var(--danger); background: var(--danger-tint-bg); }

/* ask 审批卡（critical alert banner） */
.ask-card {
  margin: 6px 16px 10px; padding: 12px 13px;
	  background: var(--danger-tint-bg); border: 1px solid var(--danger-tint-border);
	  border-left: 4px solid var(--danger); border-radius: var(--radius-sm);
}
.ask-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; color: var(--danger); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-mono); }
.ask-text { font-size: 13.5px; color: var(--fg); line-height: 1.55; word-break: break-all; margin-bottom: 11px; }
.ask-btns { display: flex; gap: 8px; }
.ask-btn {
  flex: 1; padding: 9px 0; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; font-family: var(--font-mono);
  border: 1px solid var(--border); background: var(--surface-warm); color: var(--fg-2); cursor: pointer;
}
.ask-btn.yes { background: var(--data-cyan); border-color: var(--data-cyan); color: var(--on-accent); font-weight: 800; }
.ask-btn.no { background: transparent; border-color: var(--danger-tint-border); color: var(--danger); }
.ask-extra { display: flex; gap: 8px; margin-top: 8px; }
	.ask-extra input {
	  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
	  border-radius: var(--radius-sm); padding: 11px 11px; color: var(--fg); font-size: 13px; outline: none;
}
.ask-extra button {
  padding: 0 14px; border-radius: var(--radius-sm); font-size: 11px; cursor: pointer;
  text-transform: uppercase; font-family: var(--font-mono); font-weight: 700;
  background: transparent; border: 1px solid var(--border); color: var(--fg-2);
}

	/* 输入栏 */
	.chat-input { flex: 1; display: flex; flex-direction: column; padding: 6px 10px 8px; background: var(--bg); border-top: 1px solid var(--border-soft); }
	.chat-input-row { display: flex; gap: 9px; align-items: center; }
		.chat-input input {
		  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
		  border-radius: var(--radius-pill); padding: 12px 15px; color: var(--fg);
	  font-size: 14px; outline: none; transition: border-color var(--motion-base) var(--ease-out);
	}
	.chat-input input:focus { border-color: var(--data-cyan); box-shadow: 0 0 0 2px var(--cyan-tint-bg); }
	/* 附件按钮（📎）：输入行首，与发送按钮同风格 */
	.att-btn {
	  flex-shrink: 0; width: 40px; height: 40px; border: none; border-radius: 4px; cursor: pointer;
	  background: var(--surface); border: 1px solid var(--border); color: var(--fg-2); font-size: 16px;
	  display: flex; align-items: center; justify-content: center;
	}
	.att-btn:active { transform: scale(.9); }
	/* 附件行（chips）：纵向排列，每 chip = 缩略图 + 信息 + 操作 */
	.att-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 7px; max-height: 168px; overflow-y: auto; }
	.att-chip {
	  display: flex; align-items: center; gap: 9px; padding: 6px 8px;
	  background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
	}
	.att-chip.done { border-color: var(--cyan-tint-border); }
	.att-chip.error, .att-chip.canceled { border-color: var(--danger-tint-border); }
	.att-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--muted-tint-bg); }
	.att-info { flex: 1; min-width: 0; }
	.att-name { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.att-prog { height: 3px; margin: 4px 0 2px; background: var(--muted-tint-bg); border-radius: 2px; overflow: hidden; }
	.att-prog i { display: block; height: 100%; background: var(--data-cyan); transition: width .18s ease; }
	.att-chip.done .att-prog i { background: var(--success); }
	.att-sub { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
	.att-ok { color: var(--success); }
	.att-err { color: var(--danger); }
	.att-acts { display: flex; gap: 6px; flex-shrink: 0; }
	.att-retry, .att-cancel {
	  border: 1px solid var(--border); background: transparent; color: var(--fg-2);
	  font-size: 11px; padding: 4px 9px; border-radius: 3px; cursor: pointer; font-family: var(--font-mono);
	}
	.att-retry { color: var(--data-cyan); border-color: var(--cyan-tint-border); }
	.att-cancel { color: var(--danger); border-color: var(--danger-tint-border); }
	/* 用户气泡附件图（发送后展示，本地 objectURL） */
	.bubble.attachs { padding: 5px; display: flex; gap: 5px; flex-wrap: wrap; max-width: 84%; }
	.bubble-att { width: 84px; height: 84px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
	@media (max-width: 380px) { .bubble-att { width: 64px; height: 64px; } }
.send-btn {
  width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 4px; cursor: pointer;
	  background: var(--data-amber); color: var(--on-accent); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--motion-fast) var(--ease-out);
}
	.send-btn:active { transform: scale(.9); }
	.send-btn:disabled { opacity: .38; }
.chat-hint { padding: 0 16px 7px; font-size: 10px; color: var(--muted); text-align: center; font-family: var(--font-mono); }

/* ---------- 我的页（operator profile） ---------- */
.me-hero {
  display: flex; align-items: center; gap: 14px;
  margin: 4px 16px 14px; padding: 17px 15px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--data-amber); border-radius: var(--radius-md);
}
.avatar {
  width: 50px; height: 50px; border-radius: 4px; flex-shrink: 0;
	  background: var(--data-amber); color: var(--on-accent); font-size: 21px; font-weight: 800;
  font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
}
.me-name { font-size: 16.5px; font-weight: 800; }
	.me-role { margin-top: 4px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
	/* 在线状态徽标（hero 右侧；青色 = 在线遥测语义，灰 = 离线） */
	.acct-status {
	  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
	  padding: 3px 8px; border-radius: 2px; font-size: 9.5px; font-weight: 700;
	  font-family: var(--font-mono); letter-spacing: .06em;
		  color: var(--muted); background: var(--muted-tint-bg); border: 1px solid var(--muted-tint-border);
		}
		.acct-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
		.acct-status.on {
		  color: var(--data-cyan); background: var(--cyan-tint-bg); border-color: var(--cyan-tint-border);
		}
	.acct-status.on i { background: var(--data-cyan); box-shadow: 0 0 6px var(--data-cyan); }
.me-list { margin: 0 16px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden; }
.me-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 15px; font-size: 13px; color: var(--fg-2);
  border-bottom: 1px solid var(--border-soft);
}
.me-row:last-child { border-bottom: none; }
.me-row b { font-weight: 600; font-size: 12.5px; color: var(--fg); text-align: right; word-break: break-all; }
/* ---------- 应用更新（壳内自升级卡片） ---------- */
.upd-notes { padding: 10px 15px 4px; border-bottom: 1px solid var(--border-soft); }
.upd-ver { font-size: 13px; font-weight: 700; color: var(--data-amber); }
.upd-date { margin-left: 8px; font-size: 10px; color: var(--muted); font-weight: 400; }
.upd-note { margin: 5px 0; font-size: 12px; color: var(--fg-2); line-height: 1.6; }
.upd-btn { width: 100%; padding: 12px; }
.c-ok { color: var(--success) !important; }
.c-err { color: var(--danger) !important; }
.logout-btn {
  display: block; width: calc(100% - 32px); margin: 22px 16px 0; padding: 13px;
  border-radius: var(--radius-md); cursor: pointer;
	  background: transparent; border: 1px solid var(--danger-tint-border); color: var(--danger);
  font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  font-family: var(--font-mono);
}
.acct-row { display: flex; align-items: center; gap: 10px; }
.acct-dot {
  width: 30px; height: 30px; border-radius: 4px; flex-shrink: 0;
  background: var(--surface-warm); border: 1px solid var(--border);
  color: var(--fg-2); font-size: 13px; font-weight: 700; font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
}
.role-chip {
  padding: 2px 8px; border-radius: 2px; font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-mono);
	  color: var(--muted); background: var(--muted-tint-bg); border: 1px solid var(--muted-tint-border);
	}
	.role-chip.admin { color: var(--data-amber); background: var(--amber-tint-bg); border-color: var(--amber-tint-border); }

/* ---------- 弹层（console sheet） ---------- */
.sheet { padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); }
.sheet-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.sheet-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.sheet-label { font-size: 10.5px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; letter-spacing: .1em; text-transform: uppercase; font-family: var(--font-mono); }
.node-picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.node-picker::-webkit-scrollbar { display: none; }
.np-item {
  flex-shrink: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 7px 13px; border-radius: var(--radius-pill); font-size: 12px; cursor: pointer;
  background: var(--surface-warm); border: 1px solid var(--border); color: var(--fg-2);
  font-family: var(--font-mono);
  transition: all var(--motion-fast) var(--ease-out);
}
.np-item.on { background: var(--amber-tint-bg); border-color: var(--data-amber); color: var(--data-amber); font-weight: 700; }
.task-input {
  width: 100%; box-sizing: border-box; min-height: 108px; margin-top: 4px;
  background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 12px 14px; color: var(--fg); font-size: 14px; line-height: 1.6;
  font-family: inherit; resize: none; outline: none; transition: border-color var(--motion-base) var(--ease-out);
}
.task-input:focus { border-color: var(--data-cyan); }
.task-input::placeholder { color: var(--muted); }
	.sheet-btns { display: flex; gap: 10px; margin-top: 16px; }
	.sheet-btns .btn-ghost { flex: 1; }
	.sheet-btns .btn-primary { flex: 2; padding: 12px; }
	/* 会话卡置顶态：左侧琥珀边条 + 微降亮度背景；pin-badge 内联置顶标记 */
	.tcard.pinned { box-shadow: inset 3px 0 0 var(--data-amber); }
	.tcard.pinned .tcard-text { opacity: .96; }
	.pin-badge { font-size: 11px; margin-right: 3px; }
	/* 左滑置顶按钮（swipe-btns 内与删除并排） */
	.swipe-pin {
	  min-width: 64px; height: 100%; border: none; cursor: pointer;
		  background: var(--data-cyan); color: var(--on-accent);
	  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
	  font-size: 11px; font-family: var(--font-mono); font-weight: 700;
	}
	.swipe-pin.un { background: var(--border); color: var(--fg-2); }
	/* FAB 动作菜单（点 + 先选动作：AI 自主开发 / 发布任务 / 发布绘画） */
	.fab-menu-opt {
	  display: flex; align-items: center; gap: 12px;
	  padding: 13px 14px; margin-bottom: 8px; cursor: pointer;
	  background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius-md);
	  transition: border-color var(--motion-base) var(--ease-out);
	}
	.fab-menu-opt:active { border-color: var(--data-amber); }
	.fmo-main { flex: 1; min-width: 0; }
	.fmo-name { font-size: 13.5px; font-weight: 600; }
	.fmo-desc { margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.mode-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 14px; margin-bottom: 8px; cursor: pointer;
  background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius-md);
  transition: border-color var(--motion-base) var(--ease-out);
}
.mode-opt.on { border-color: var(--data-amber); }
.mo-name { font-size: 13.5px; font-weight: 600; }
.mo-desc { margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.radio {
  width: 19px; height: 19px; border-radius: 2px; flex-shrink: 0;
  border: 2px solid var(--border); transition: all var(--motion-base) var(--ease-out); box-sizing: border-box;
}
.radio.on { border-color: var(--data-amber); background: radial-gradient(circle, var(--data-amber) 42%, transparent 46%); }

/* ---------- 知识库（doc/） ---------- */
.dcard {
  margin: 0 16px 10px; padding: 13px 14px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); cursor: pointer; position: relative;
  transition: border-color var(--motion-base) var(--ease-out);
}
.dcard:active { border-color: var(--data-cyan); }
.dcard-name {
  font-size: 14px; font-weight: 600; color: var(--fg);
  display: flex; align-items: center; gap: 8px; padding-right: 70px;
}
.dcard-name .van-icon { color: var(--data-amber); font-size: 16px; }
.dcard-meta {
  margin-top: 6px; display: flex; align-items: center; gap: 10px;
  font-size: 11px; color: var(--muted); font-family: var(--font-mono);
}
.dcard-actions { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
.dcard-act {
  width: 30px; height: 30px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--surface-warm); color: var(--fg-2); font-size: 14px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.dcard-act.danger { color: var(--danger); }
.fab-new {
  position: fixed; right: 16px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
  width: 52px; height: 52px; border-radius: 6px; border: none; z-index: 90;
	  background: var(--data-amber); color: var(--on-accent); font-size: 22px; font-weight: 700;
	  box-shadow: 0 6px 20px var(--amber-tint-border); cursor: pointer;
}
/* 查看页（覆盖式全屏，同聊天页语义） */
.docview-head {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: calc(env(safe-area-inset-top)) 12px 0;
  height: var(--header-h); box-sizing: content-box;
	  display: flex; align-items: center; gap: 8px;
	  background: var(--header-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-soft);
}
.dv-back { width: 34px; height: 34px; border: none; background: transparent; color: var(--fg-2); font-size: 18px; cursor: pointer; }
.dv-title { font-size: 14px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-act {
  height: 30px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--surface-warm); color: var(--fg-2); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
}
.dv-act.primary { color: var(--on-accent); background: var(--data-cyan); border-color: var(--data-cyan); font-weight: 700; }
.docview-body { padding: calc(var(--header-h) + env(safe-area-inset-top) + 14px) 16px 30px; }
.doc-md {
  font-size: 14px; line-height: 1.75; color: var(--fg-2);
  word-break: break-word; overflow-wrap: anywhere;
}
.doc-md .md-h { color: var(--fg); font-weight: 700; margin: 1.1em 0 .45em; line-height: 1.35; }
.doc-md h3.md-h { font-size: 17px; border-bottom: 1px solid var(--border-soft); padding-bottom: 6px; }
.doc-md h4.md-h { font-size: 15.5px; }
.doc-md h5.md-h { font-size: 14.5px; }
.doc-md .md-p { margin: .5em 0; }
.doc-md ul, .doc-md ol { margin: .5em 0; padding-left: 22px; }
.doc-md li { margin: .25em 0; }
.doc-md .md-quote {
  margin: .7em 0; padding: 8px 12px; border-left: 3px solid var(--data-amber);
  background: var(--surface); border-radius: 0 4px 4px 0; color: var(--muted);
}
.doc-md .md-pre {
  margin: .7em 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: 4px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6;
  color: var(--data-cyan);
}
.doc-md code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-warm); padding: 1px 5px; border-radius: 3px; color: var(--data-amber); }
.doc-md .md-pre code { background: transparent; padding: 0; color: inherit; }
.doc-md .md-hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.doc-md a { color: var(--meta); }
.doc-edit-ta {
  width: 100%; box-sizing: border-box; min-height: 60vh;
  background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 12px 14px; color: var(--fg); font-size: 13.5px; line-height: 1.7;
  font-family: var(--font-mono); resize: vertical; outline: none;
}
.doc-edit-ta:focus { border-color: var(--data-cyan); }
.docview-acts { display: flex; gap: 10px; margin-top: 14px; }
.docview-acts .btn-ghost { flex: 1; }
.docview-acts .btn-primary { flex: 2; }

/* ---------- Vant 深色微调 ---------- */
.van-empty__image { opacity: .5; }
.van-toast { border: 1px solid var(--border); backdrop-filter: blur(8px); }
.van-dialog { border: 1px solid var(--border); }
.van-dialog__confirm, .van-dialog__confirm:active { color: var(--data-cyan); }
	.van-pull-refresh { overflow: visible; }
	.van-popup { overflow: visible; }
	/* 底部弹层随键盘让位：--kb-h 由 visualViewport 监听写入（见脚本 syncKeyboard）；
	   Android 键盘本就压缩 layout viewport（--kb-h≈0 不受影响），iOS 系键盘不压缩 → 靠此偏移顶起 */
	.van-popup--bottom { bottom: var(--kb-h, 0); max-height: calc(100dvh - var(--kb-h, 0px) - 12px); }

	/* ---------- 微交互增强层（UX Plus，2026-10-01） ----------
	   目标：不改动任何业务逻辑与协议，纯前端可感知体验提升：
	   页面转场 / 卡片入场 / 触感反馈 / 骨架屏 / 搜索 / 未读徽标 / 回到底部 */
	/* 页面主内容转场：tab 切换 / 聊天页进出时的淡入上浮（transform+opacity，GPU 友好） */
	.page, .page-chat { animation: pageIn var(--motion-slow) var(--ease-out) both; }
	.page-chat { animation-name: chatIn; }
	@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
	@keyframes chatIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
	/* 任务卡 / 会话卡入场：每张卡 12ms 递进延迟（style 内联 --i），列表扫描感 */
	.van-swipe-cell { animation: cardIn .26s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 12ms); }
	@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
	/* 触感反馈：所有可点卡/按钮按下时微缩 + 指定卡片按压缩放（active 态瞬时） */
	.tcard:active { transform: scale(.985); }
	.ncard:active { transform: scale(.985); }
	.dcard:active { transform: scale(.985); }
	.fchip:active { transform: scale(.95); }
	.tcard, .ncard, .dcard, .fchip { transition: transform 90ms var(--ease-out), border-color var(--motion-fast) var(--ease-out); }
	/* 骨架屏（任务/会话首屏加载）：三个脉冲占位条，消除白屏等待感 */
	.sk { margin: 0 16px 8px; padding: 12px 13px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); }
	.sk i { display: block; height: 11px; border-radius: 2px; background: linear-gradient(90deg, var(--border-soft) 25%, var(--surface-warm) 45%, var(--border-soft) 65%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
	.sk i + i { margin-top: 8px; }
	.sk i:nth-child(1) { width: 72%; }
	.sk i:nth-child(2) { width: 92%; height: 9px; }
	.sk i:nth-child(3) { width: 40%; height: 8px; }
	@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
	/* 搜索框：任务页/会话页顶部（mono 风格，聚焦青色描边） */
	.search-wrap { margin: 0 16px 8px; position: relative; }
	.search-wrap .van-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
		.search-inp {
		  width: 100%; box-sizing: border-box; padding: 11px 32px 11px 34px;
	  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
	  color: var(--fg); font-size: 13px; outline: none;
	  transition: border-color var(--motion-base) var(--ease-out), box-shadow var(--motion-base) var(--ease-out);
	}
	.search-inp::placeholder { color: var(--muted); }
		.search-inp:focus { border-color: var(--data-cyan); box-shadow: 0 0 0 2px var(--cyan-tint-bg); }
	.search-clear {

function wsSend(type, payload) {

    pending[id] = resolve;
    setTimeout(() => {
      if (pending[id]) { pending[id]({ type: "server.error", payload: { message: "请求超时" } }); delete pending[id]; }
    }, timeoutMs || 8000);
  });

	// WS 心跳参数：25s 一探，连续 2 次无 pong（约 50s）判假活强制重建连接。
	// 背景（长期反馈「PC 端执行完了移动端状态不更新」根因）：手机休眠/切后台/弱网
	// 致 TCP 半开时 onclose 不触发，wsOnline 恒 true（假活），服务端广播的
	// task.result（PC 端 agent.task_done → hub.TaskDone）永远发不到死连接；
	// 且旧版 onclose 固定 2.5s 重连无退避，弱网下重连风暴。状态权威源在服务端，
	// 本端职责：维持活链路 + 定期拉权威快照兑底。
	const HB_INTERVAL = 25000, HB_MAX_MISS = 2, RECONNECT_MAX = 30000;
	let hbTimer = 0, hbMissed = 0, reconnectTimer = 0, reconnectAttempts = 0;
	function hbStop() { if (hbTimer) { clearInterval(hbTimer); hbTimer = 0; } }
	function reconnectCancel() { if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = 0; } }
	function scheduleReconnect(delay) {
	  reconnectCancel();
	  reconnectTimer = setTimeout(() => { reconnectTimer = 0; connect(); }, delay);
	}
	function connect() {
	  reconnectCancel();
	  hbStop();
	  if (state.ws) { try { state.ws.onclose = null; state.ws.close(); } catch (e) {} state.ws = null; } // 旧连接静默丢弃（防双连接双回调）
	  const proto = location.protocol === "https:" ? "wss://" : "ws://";
	  const ws = new WebSocket(proto + location.host + "/ws/client");
	  state.ws = ws;

	  setTimeout(() => { if (state.ws === ws && ws.readyState === 0) { try { ws.close(); } catch (e) {} } }, 10000);
	  ws.onopen = () => {
	    state.wsOnline = true;
	    reconnectAttempts = 0; // 连接成功：退避复位
	    hbMissed = 0;
	    hbStop();

	      if (hbMissed >= HB_MAX_MISS) {

	        try { ws.onclose = null; ws.close(); } catch (e) {}

	}

			        if (p.ok && p.newTaskId) {
			          showSuccessToast("🧹 已汇总并清空，续接任务已创建并开始运行");
			        } else if (p.ok) {
			          showToast("🧹 清理完成：无未完成任务，历史已清空");
			        } else {
			          showFailToast(p.error || "总结并清理失败");
			        }
			      } else if (p.ok) {
			        showToast("🗑 已清空 " + (p.deleted || 0) + " 条任务记录" + ((p.canceled || 0) > 0 ? "（含 " + p.canceled + " 个运行中/待执行任务已取消）" : ""));
			      }
			      break;
			    }

	    // 任务状态核实完成（刷新小按钮发起：节点本地会话真实状态回核 PC/服务端任务）。
	    // 服务端已先广播修正后的全量 tasks（状态/终态标注随 tasks 分支自动收敛），
	    // 此处仅提示结果 + 复位核实中状态（修正明细折叠进会话页可查，避免弹层打断）。
	    case "verify.done": {
	      const p = msg.payload || {};
	      state.verifyBusy = false;
	      if (p.ok) {
	        if (p.fixed > 0) {
	          showSuccessToast("✅ 核实完成：修正 " + p.fixed + " 个任务状态（已同步 PC 端真实状态）");
	        } else if ((p.checked || 0) > 0) {
	          showToast("✓ 核实完成：" + p.checked + " 个任务与 PC 端一致");
	        } else {
	          showToast("✓ 核实完成：暂无待核实的任务");
	        }
	      } else {
	        showFailToast(p.error || "核实失败：无在线节点");
	      }
	      break;
	    }

    case "node.config": {
      // 节点配置快照广播（get.config 应答带请求 id 走 pending resolve；
      // 此处处理的是无 id 广播：set.config 成功后节点回报 agent.config）。
      const p = msg.payload || {};
      if (p.nodeId === (state.cfgNode && state.cfgNode.id) && state.cfgSaving && p.config) {
        applyCfg(p.config);
        state.cfgSaving = false;
        state.showCfg = false;
        showSuccessToast("配置已保存");
      }
      break;
    }
    case "op.result":
      if (msg.payload && msg.payload.ok === false) {
        if (state.cfgSaving) state.cfgSaving = false; // 服务端路由失败（如节点离线），失败 toast 已提示
        showFailToast(msg.payload.message || "操作失败");
      }
      break;
			    case "skills": {
			      // 技能列表广播（agent.skills_list / skills.list 应答）：
			      // 当前技能库归属节点匹配才刷新（多节点下避免串列表）。
			      const sp = msg.payload || {};
			      if (!state.skillsNode || sp.nodeId === state.skillsNode) {
			        state.skills = sp.skills || [];
			      }
			      break;
			    }
		    case "skills.item": {
		      // 技能全文回传（server.skills_get → 节点 agent.skills_data）：
		      // OK → 打开技能页（等待中按名称关联；已打开页同步刷新）；
		      // 失败（节点拒绝/读取失败）toast 错误信息。
		      const it = msg.payload || {};
		      if (state.skillPending && it.name === state.skillPending.name) {
		        const src = state.skillPending.source;
		        state.skillPending = null;
		        if (it.ok && typeof it.content === "string") {
		          fillSkillView(it.name, src, it.content);
		        } else {
		          showFailToast(it.error || "节点未回传技能内容");
		        }
		        break;
		      }
		      // 已打开同一技能页（如他人触发刷新）：静默同步内容。
		      if (it.name && state.skillView && state.skillView.name === it.name && typeof it.content === "string") {
		        state.skillView.content = it.content;
		        if (!state.skillEditing) state.skillDraft = it.content;
		      }
		      break;
		    }
		    case "server.error":
		      if (state.cfgSaving) state.cfgSaving = false; // 节点保存失败回报（client.go handleSetConfig → server.error 转发）
		      if (state.skillSaving) state.skillSaving = false; // 技能保存/删除失败回报（server.skills_save/delete → 节点拒绝）
			      if (state.rmPlanning) state.rmPlanning = false;   // 规划失败回报（server.roadmap_plan → 节点拒绝/LLM 失败），rmApply 亦会复位（快照收敛）
		      if (state.rmDevBusy) state.rmDevBusy = false;    // 执行失败回报
		      showFailToast((msg.payload && msg.payload.message) || "服务端错误");
		      break;
												// AR 自主开发：规划板数据（roadmap.list 应答带 id 走 pending resolve；
												// 此处处理的是无 id 广播：节点变更后 agent.roadmap_data → roadmap 广播）。
												case "roadmap":
												  rmApply(msg.payload || {});
												  break;
												// A2A 群聊：群列表广播（agent.group_state → groups；group.list 应答带 id 走 pending）
												case "employees":
												  state.employees = (msg.payload && msg.payload.employees) || [];
												  break;
												case "groups":
												  state.groups = (msg.payload && msg.payload.groups) || [];
												  break;
												// 群消息广播（用户/员工/群助手）：当前群实时追加
												case "group.message":
												  appendGroupMsg(msg.payload || {});
												  break;
												// 群状态快照（group.sync 应答走 pending resolve；此处为节点广播覆盖）
												case "group.state": {
												  const p = msg.payload || {};
												  if (Array.isArray(p.groups) && p.groups.length && state.groupCur) {
												    const g = p.groups.find((x) => x.id === state.groupCur.id);
												    if (g) state.groupCur = g;
												  }
												  if (Array.isArray(p.messages)) {
												    state.groupMsgs = p.messages;
												    scrollGroupBottom();
												  }
												  break;
												}
												// 群写任务完成（群助手汇总）：当前群追加结果卡
												case "group.task_done": {
												  const tk = msg.payload || {};
												  if (state.groupCur && tk.groupId === state.groupCur.id) {
												    const icon = tk.status === "done" ? "✅" : "❌";
												    state.groupMsgs.push({ id: "task-" + (tk.id || Date.now()), groupId: tk.groupId, author: "bot", authorName: "群助手", authorKind: "bot", text: icon + " 任务" + (tk.status === "done" ? "完成" : "失败") + "：" + (tk.result || ""), ts: Date.now() });
												    scrollGroupBottom();
												  }
												  break;
												}
		  }
		}

	// ---------- 技能库（PC 节点技能，skills.* 协议链路） ----------
	// nodeId 取当前选中节点：节点页点击模式弹层的 modeTargetNode / 任务筛选
	// filterNode 优先，否则首个在线节点，兑底首节点。无节点时列表为空提示。
	function currentSkillNode() {
	  if (state.modeTargetNode && state.modeTargetNode.id) return state.modeTargetNode.id;
	  if (state.filterNode) return state.filterNode;
	  const on = state.nodes.find((n) => n.online);
	  if (on) return on.id;
	  return state.nodes.length ? state.nodes[0].id : "";
	}
	async function loadSkills() {
	  const nodeId = currentSkillNode();
	  if (!nodeId) { state.skills = []; return; }
	  state.skillsNode = nodeId;
	  state.skillsLoading = true;
	  try {
	    const res = await request("skills.list", { nodeId }, 10000);
	    const p = res.payload || {};
	    if (res.type === "skills" || (p && p.skills)) {
	      state.skills = p.skills || p || [];
	    }
	  } catch (e) {} finally {
	    state.skillsLoading = false;
	  }
	}
	function skillSourceLabel(src) {
	  return ({ builtin: "内置", global: "全局", project: "项目" })[src] || src || "未知";
	}
	function filteredSkills() {
	  const kw = (state.skillQuery || "").trim().toLowerCase();
	  if (!kw) return state.skills;
	  return state.skills.filter((x) =>
	    (x.name || "").toLowerCase().indexOf(kw) >= 0
	    || (x.description || "").toLowerCase().indexOf(kw) >= 0);
	}
		function fillSkillView(name, source, content) {
		  state.skillView = { name, source, content, readOnly: source === "builtin" };
		  state.skillName = name;
		  state.skillDraft = content;
		  state.skillEditing = false;
		  state.skillNewMode = false;
		  activeTab.value = "skill-view";
		}
		async function openSkill(sk) {
		  if (!sk || !sk.name) return;
		  showLoadingToast({ message: "加载中", duration: 0, forbidClick: true });
		  // 记录等待中的技能（skills.item 广播无 id，按名称关联打开）。
		  state.skillPending = { name: sk.name, source: sk.source || "" };
		  const res = await request("skills.get", { nodeId: state.skillsNode || currentSkillNode(), name: sk.name }, 12000);
		  closeToast();
		  const p = (res && res.payload) || {};
		  // 防御：若响应直带全文（服务端直答形态），立即打开。
		  if (res.type === "skills.item" && p && p.name === sk.name && typeof p.content === "string") {
		    state.skillPending = null;
		    fillSkillView(sk.name, sk.source || "", p.content);
		    return;
		  }
		  if (res.type === "op.result" && p && p.ok) {
		    return; // 已受理：等 skills.item 广播（dispatch 内按 skillPending 打开页面）
		  }
		  state.skillPending = null; // 失败/超时（路由失败已由 op.result 分支 toast）
		}
	function startEditSkill() {

		async function saveSkill() {
		  if (state.skillSaving) return;
		  const name = state.skillNewMode ? (state.skillName || "").trim() : (state.skillView && state.skillView.name || "");
	  if (!name) { showFailToast("请输入技能名（小写字母/数字/连字符）"); return; }
	  if (!/^[a-z0-9-]{1,64}$/.test(name)) { showFailToast("技能名仅限小写字母/数字/连字符"); return; }
	  state.skillSaving = true;
	  try {
	    const res = await request("skills.save", { nodeId: state.skillsNode || currentSkillNode(), name, content: state.skillDraft }, 10000);
	    if (res.type === "op.result" && res.payload && res.payload.ok) {
	      showSuccessToast("已受理，等待节点确认");
	      state.skillEditing = false;
	      if (state.skillNewMode) {
	        state.skillNewMode = false;
	        state.skillView = { name, source: "project", content: state.skillDraft, readOnly: false };
	        activeTab.value = "skill-view";
	      } else {
	        state.skillView.content = state.skillDraft;
	      }
	    } else {

	}

	  if (res.type === "op.result" && res.payload && res.payload.ok) {
	    showSuccessToast("删除已受理");

	// ---------- AR 自主开发（PC 节点规划板，roadmap.* 协议链路） ----------
	// 链路：roadmap.list/plan/dev/delete → 服务端路由节点 → 节点操作本地规划板
	//（roadmap_panel.go 同源数据）→ agent.roadmap_data → 服务端落缓存 + roadmap
	// 广播 → 本页实时同步。执行门禁：必须先勾选提案（rmChecked 非空）才能点执行。
		const RM_STATUS = {
		  proposed: "待审核", approved: "已排期", developing: "开发中",
		  done: "已完成", failed: "失败", blocked: "已暂停", rejected: "已驳回",
		};
	function rmStatusText(st) { return RM_STATUS[st] || st || "-"; }
		function rmPriorityText(p) { return ({ high: "高", medium: "中", low: "低" })[p] || ""; }
	function rmCategoryText(c) { return ({ feature: "功能", bug: "缺陷", refactor: "重构", docs: "文档", tooling: "工程" })[c] || c || ""; }
	// 分组视图：待审核提案（可勾选）→ 排期/开发中 → 终态。
	const rmProposals = computed(() => state.rmItems.filter((x) => x.status === "proposed"));
	const rmActive = computed(() => state.rmItems.filter((x) => x.status === "approved" || x.status === "developing"));
	const rmFinished = computed(() => state.rmItems.filter((x) => ["done", "failed", "blocked", "rejected"].includes(x.status)));
	// 已批准条目占全部条目比例（顶部进度条）。
	function rmPct() {
	  const t = state.rmStats.total || 0;
	  if (!t) return 0;
	  const fin = (state.rmStats.done || 0) + (state.rmStats.approved || 0) + (state.rmStats.developing || 0);

				// ---------- 规划板模板（内置 + 自定义；变更即写 localStorage，刷新不丢失） ----------

				const BUILTIN_PLAN_TPLS = [

				  { id: "tpl-builtin-bugfix", name: "缺陷修复", guidance: "优先修复登录链路、消息不同步、黑屏/白屏等影响使用的缺陷，附带回归验证。" },
				  { id: "tpl-builtin-perf", name: "性能优先", guidance: "优先排查性能问题：列表长卡顿、渲染重热点、接口耗时，量化验收。" },
				  { id: "tpl-builtin-doc", name: "文档完善", guidance: "优先补齐文档：使用手册、部署运维、接口说明，中文为主，随代码同步。" },
				];
				const TPL_STORE_KEY = "gh_mobile.planTemplates";
				function loadPlanTpls() {
				  let custom = [];
				  try { custom = JSON.parse(localStorage.getItem(TPL_STORE_KEY) || "[]") || []; } catch (e) { custom = []; }
				  // 合并内置+自定义，按最近使用降序（未使用过排后，保持稳定序）。
				  const all = [
				    ...BUILTIN_PLAN_TPLS.map((t) => ({ id: t.id, name: t.name, guidance: t.guidance, builtin: true, lastUsedAt: 0 })),
				    ...custom.map((t) => ({ id: t.id, name: t.name, guidance: t.guidance, builtin: false, lastUsedAt: t.lastUsedAt || 0 })),
				  ];
				  all.sort((a, b) => (b.lastUsedAt || 0) - (a.lastUsedAt || 0));
				  return all;
				}
				function savePlanTpls(custom) {
				  try { localStorage.setItem(TPL_STORE_KEY, JSON.stringify(custom)); } catch (e) {}
