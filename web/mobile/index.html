			// 提交单条（标题必填；成功自动清空保持弹层打开 = 连续录入；服务端校验 NodeID/Title）。
			async function submitRmAdd() {
			  const title = (state.rmAddTitle || "").trim();
			  if (!title) { showFailToast("请输入任务标题"); return; }
			  if (state.rmAddBusy) return;
			  state.rmAddBusy = true;
			  try {
			    const res = await request("roadmap.add", {
			      nodeId: state.rmNode,
			      title,
			      detail: (state.rmAddDetail || "").trim(),
			      priority: state.rmAddPriority || "medium",
			    }, 12000);
			    if (res.type === "op.result" && res.payload && res.payload.ok) {
			      state.rmAddCount++;
			      state.rmAddTitle = ""; state.rmAddDetail = "";
			      showSuccessToast("已添加「" + title.slice(0, 20) + "」，继续录入或点完成");
			      loadRoadmap(); // 兑底刷新（广播为主要收敛路径）
			    } else {
			      const m = (res.payload && res.payload.message) || ((res.payload && res.payload.error) || "添加失败");
			      showFailToast(typeof m === "string" ? m : "添加失败");
			    }
			  } finally {
			    state.rmAddBusy = false;
			  }
			}

			// 规划板节点选定：与技能库同源（首个在线节点优先），无节点时列表空提示。
			async function loadRoadmap() {
		  const nodeId = currentSkillNode();
		  if (!nodeId) { state.rmNode = ""; state.rmItems = []; return; }
		  state.rmNode = nodeId;
		  state.rmLoading = true;
		  try {
		    const res = await request("roadmap.list", { nodeId }, 10000);
		    const p = (res && res.payload) || {};
		    if (res.type === "roadmap" || (p && Array.isArray(p.items))) {
		      rmApply(p); // 与 roadmap 广播共用应用逻辑（含勾选清理，防残留勾选提交被拒）
		    }
		  } catch (e) {} finally {
		    state.rmLoading = false;
		  }
		}
		// AI 规划（引导意见选填）：受理后等 roadmap 广播收敛；完成/失败提示在
		// rmApply（快照到达即收敛）与 server.error 分支处理（避免双 toast）。
		async function rmPlan() {
		  if (!state.rmNode) { showFailToast("暂无在线节点，无法规划"); return; }
		  if (state.rmPlanning) return;
		  state.rmPlanning = true;
		  showToast("AI 正在分析项目并规划…");
		  try {
		    const res = await request("roadmap.plan", { nodeId: state.rmNode, guidance: (state.rmGuidance || "").trim() }, 15000);
	    const p = (res && res.payload) || {};
	    if (res.type === "op.result" && p.ok === false) {
	      showFailToast(p.message || "规划请求失败");
	      state.rmPlanning = false; // 受理失败立即释放，避免干等 10 分钟兑底
	    } else if (res.type === "op.result" && p.ok) {
	      showToast("已受理：PC 端分析中（约 1~3 分钟），完成后自动刷新");
	    } else if (res.type === "server.error" && p.message === "未连接") {
	      state.rmPlanning = false; // 链路未建立：规划未送达，立即释放
	    }
	    // 15s 请求超时（server.error「请求超时」）：受理可能已达 PC 端（先受理后应答），
	    // 保持规划中等待 roadmap 广播收敛 / 10 分钟兑底复位。
	  } finally {
	    // 规划异步（LLM 分钟级）：按钮保持锁定，快照到达由 roadmap 广播（rmApply）复位；10 分钟兑底。
	    setTimeout(() => { if (state.rmPlanning) state.rmPlanning = false; }, 600000);
	  }
			}
			// 弹层内提交：沿用 rmPlan 原链路（受理后等 roadmap 广播收敛；10 分钟兑底；不重复 toast）。
			async function rmPlanSubmit() {
				  if (state.rmPlanning) return;
				  try {
				    await rmPlan();
				    state.showRmPlus = false;
				  } catch (e) {
				    showFailToast("规划请求失败，请重试");
				  }
				}
		// 执行自主开发（强制选择门禁：rmChecked 为空直接拦截 + 执行按钮 disabled 双保险；
		// 服务端/节点侧还有第三重校验）。勾选的提案批准后进入 PC 端开发队列。
		async function rmDev() {
	  if (!state.rmChecked.length) { showFailToast("请先勾选要开发的提案（未选择不能执行）"); return; }
	  if (state.rmDevBusy) return;
	  try {
	    await showConfirmDialog({
	      title: "执行自主开发",
	      message: "将把已选 " + state.rmChecked.length + " 条提案批准并交 PC 端开发（开发过程可在任务页查看）。\n\n确定执行？",
      confirmButtonColor: dialogColor("amber"),
    });
  } catch (e) { return; } // 取消
  state.rmDevBusy = true;
	  try {
	    const auto = state.rmAuto || {};
	    const serial = (auto.devMode || "parallel") === "serial";
	    const parallel = serial ? 1 : Math.min(4, Math.max(1, Number(auto.parallel) || 2));
	    const res = await request("roadmap.dev", { nodeId: state.rmNode, ids: state.rmChecked, mode: serial ? "serial" : "parallel", parallel }, 15000);
	    const p = (res && res.payload) || {};
		    if (res.type === "op.result" && p.ok) {
		      showSuccessToast("已提交 " + state.rmChecked.length + " 条进入开发（" + (serial ? "依次执行" : "并行 " + parallel + " 路") + "），点击「排期开发」卡可回看过程");
		      state.rmChecked = [];
		      loadRoadmap(); // 兑底刷新（节点回传广播为主要收敛路径）
		    } else {
		      showFailToast(p.message || "执行请求失败");
		    }
	  } finally {
	    state.rmDevBusy = false;
	  }
	}
	// 删除条目（终态/提案均可删；开发中条目 PC 端会先停止会话任务再删）。
	async function rmRemove(it) {
	  try {
	    await showConfirmDialog({ title: "删除条目", message: "确定删除「" + (it.title || it.id) + "」？不可恢复。", confirmButtonColor: dialogColor("danger") });
	  } catch (e) { return; }
	  const res = await request("roadmap.delete", { nodeId: state.rmNode, id: it.id }, 10000);
	  const p = (res && res.payload) || {};
	  if (res.type === "op.result" && p.ok) {
	    showToast("删除已受理");
	  } else {
	    showFailToast(p.message || "删除失败");
	  }
	}
		// 打开开发会话（排期/开发中/终态卡点击）：固定会话 ID roadmap_<itemID>（与 PC 端
		// roadmapDevelopSessionID 同规则；旧 PC 端投影无 sessionId 时兑底派生），
		// 直接进会话页回看开发过程（历史经 get.messages → 节点回传）。
		function openRmSession(it) {
		  if (!it || !it.id) return;
		  const stMap = { approved: "pending", developing: "running", done: "done", failed: "failed", blocked: "failed", rejected: "canceled" };
		  openSessionChat(it.sessionId || ("roadmap_" + it.id), "", it.title || "开发会话", stMap[it.status] || it.status);
		}
		// 执行日志格式化（rmFinished 卡片展示最近一次：耗时 + 结论 + 改动文件数）。
		function rmRunLogLine(it) {
		  const r = Array.isArray(it.runLog) && it.runLog[0];
		  if (!r) return "";
		  const dur = r.durationMS > 0 ? Math.round(r.durationMS / 1000) + "s" : "";
		  const files = Array.isArray(r.files) && r.files.length ? r.files.length + " 文件" : "";
		  const parts = [dur, files].filter(Boolean);
		  return parts.length ? parts.join(" · ") : (r.outcome === "done" ? "已完成" : "失败");
		}
		// 最近一次改动文件（执行轨迹可追溯；无则空）。
		function rmRunFiles(it) {
		  const r = Array.isArray(it.runLog) && it.runLog[0];
		  return r && Array.isArray(r.files) ? r.files.slice(0, 3) : [];
		}
		// 一键重跑（failed/blocked → roadmap.retry 协议；受理后 roadmap 广播刷新）。
		async function rmRetry(it) {
		  const res = await request("roadmap.retry", { nodeId: state.rmNode, id: it.id }, 10000);
		  const p = (res && res.payload) || {};
		  if (res.type === "op.result" && p.ok) {
		    showToast("已重新入队");
		  } else {
		    showFailToast(p.message || "重跑失败");
		  }
		}
		// 规划板数据应用（roadmap.list 应答 / roadmap 广播共用；多节点广播过滤归属）。
		function rmApply(p) {
		  if (!p || !Array.isArray(p.items)) return;
		  if (p.nodeId && p.nodeId !== state.rmNode) return; // 非当前节点广播：忽略（防串板）
		  const before = state.rmStats.proposed || 0;
		  state.rmItems = p.items;
		  state.rmStats = p.stats || state.rmStats;
		  if (p.auto) state.rmAuto = p.auto;
		  // 规划收敛复位：规划中收到当前节点任意规划板快照即视为本轮规划已收敛——
		  // 提案产出 / 去重为空（模型判无值得做）/ 被驳回都会回传快照。旧逻辑仅按
		  // proposed 计数变化复位，「规划成功但 0 新增」会把按钮卡在「规划中…」
		  // 直到 10 分钟兑底（用户反馈「点了规划没反应」根因之一）。
		  if (state.rmPlanning) {
		    state.rmPlanning = false;
		    const now = (p.stats && p.stats.proposed) || 0;
		    if (now > before) {
		      showSuccessToast("AI 规划完成：新增 " + (now - before) + " 条提案，勾选后执行开发");
		    } else {
		      showToast("AI 规划完成：本轮未新增提案（项目现状可能已被既有条目覆盖）");
		    }
		  }
	  // 勾选清理：已不在提案列表的 ID 移除（提案被执行/删除/刷新覆盖后自动出勾选区），
	  // 防残留勾选提交到服务端被「没有可批准的条目」拒绝。
	  const ids = new Set(rmProposals.value.map((x) => x.id));
	  state.rmChecked = state.rmChecked.filter((id) => ids.has(id));
	}

		// ---------- 搜索 / 筛选 / 批量清理（2026-10 重设计） ----------
		// rmStatCards KPI 统计卡数据（点击切换状态筛选）；rmGroup 按状态分组；
		// rmActiveGroup / rmFinishedGroup 进行中/终态分组（列表分段渲染）。
				function rmStatCards() {
				  const s = state.rmStats || {};
				  return [
				    { st: "proposed",   label: "待审核", n: s.proposed || 0, color: "var(--danger)" },
				    { st: "approved",   label: "已排期", n: s.approved || 0, color: "var(--data-amber)" },
				    { st: "developing", label: "开发中", n: s.developing || 0, color: "var(--warn)" },
				    { st: "done",       label: "已完成", n: s.done || 0, color: "var(--success)" },
				    { st: "failed",     label: "失败", n: s.failed || 0, color: "var(--danger)" },
				    { st: "blocked",    label: "已暂停", n: s.blocked || 0, color: "var(--warn)" },
				    { st: "total",      label: "总计", n: s.total || 0, color: "var(--muted)" },
				  ];
			}
		function rmGroup(st) { return state.rmItems.filter((x) => x.status === st); }
		function rmActiveGroup() { return state.rmItems.filter((x) => x.status === "approved" || x.status === "developing"); }
		function rmFinishedGroup() { return state.rmItems.filter((x) => rmIsTerminal(x)); }
		// rmFiltered 搜索 + 状态筛选后的条目（列表渲染数据源）。
	function rmFiltered() {
	  const q = (state.rmQuery || "").trim().toLowerCase();
	  const f = state.rmStatusFilter || "all";
	  return state.rmItems.filter((x) => {
	    if (f !== "all" && x.status !== f) return false;
	    if (q) {
	      const hay = ((x.title || "") + " " + (x.detail || "") + " " + (x.review || "") + " " + (x.result || "")).toLowerCase();
	      if (!hay.includes(q)) return false;
	    }
	    return true;
	  });
	}
	// rmCheckAllByStatus 按状态组全选（KPI 卡 / 分组头）；rmUncheckAll 清空勾选。
	function rmCheckAllByStatus(st) {
	  state.rmChecked = state.rmItems.filter((x) => !st || x.status === st).map((x) => x.id);
	}
		function rmUncheckAll() { state.rmChecked = []; }
		// rmSetParallel 执行设置弹层并行线程数（1-4；同步置 devMode=parallel）。
		function rmSetParallel(n) {
		  const p = Math.min(4, Math.max(1, Number(n) || 1));
		  state.rmAuto = Object.assign({}, state.rmAuto, { parallel: p, devMode: "parallel" });
		}
		// rmBulkToggleAll 上方批量条全选/清空 toggle：当前筛选已全选 → 清空；否则全选当前筛选。
		function rmBulkToggleAll() {
		  const ids = rmFiltered().map((x) => x.id);
		  state.rmChecked = ids.length && ids.every((id) => state.rmChecked.includes(id)) ? [] : ids;
		}
		// 终态条目（可批量删除候选）。
		function rmIsTerminal(x) { return ["done", "failed", "blocked", "rejected"].includes(x.status); }
		// 详情 sheet 开关（纸感重设计：点卡片弹底部详情层；批模式下不弹层，点卡=切换勾选）。
		function openRmDetail(it) {
		  if (!it || !it.id || state.rmBatchMode) return;
		  state.rmDetail = it;
		}
		function closeRmDetail() { state.rmDetail = null; }
		// 卡片副行文案（review/result/error/blockedReason 首行 60 字；对齐桌面 rm-cell-sub 语义）。
		function rmCardSub(it) {
		  if (it && it.review) return { text: firstLine(it.review, 60), cls: "" };
		  if (it && it.status === "done") return { text: firstLine(it.result || "", 60), cls: "ok" };
		  if (it && (it.status === "failed" || it.status === "blocked")) {
		    return { text: firstLine(it.blockedReason || it.error || "失败", 60), cls: "err" };
		  }
		  if (it && it.detail) return { text: firstLine(it.detail, 60), cls: "" };
		  return { text: "", cls: "" };
		}
		// 来源文案（对齐桌面 source 映射：manual/autodev/remote → 手动/自动/远端，缺省 AI）。
		function rmSourceText(s) {
		  return s === "manual" ? "手动" : s === "autodev" ? "自动" : s === "remote" ? "远端" : "AI";
		}
		// 状态筛选芯片行数据（all + 7 态；count 随 stats 更新；对齐桌面 statusTabs）。
		function rmStatusTabs() {
		  const s = state.rmStats || {};
		  return [
		    { st: "all", label: "全部", n: s.total || 0 },
		    { st: "proposed", label: "待审核", n: s.proposed || 0 },
		    { st: "approved", label: "已排期", n: s.approved || 0 },
		    { st: "developing", label: "开发中", n: s.developing || 0 },
		    { st: "done", label: "已完成", n: s.done || 0 },
		    { st: "failed", label: "失败", n: s.failed || 0 },
		    { st: "blocked", label: "已暂停", n: s.blocked || 0 },
		    { st: "rejected", label: "已驳回", n: s.rejected || 0 },
		  ];
		}
		// 执行栏视图态：并行/依次 + 并行数 1-4（P1 仅视图态；rmDev 读取 rmAuto 投影，不扩协议）。
		function rmDevMode() { return ((state.rmAuto && state.rmAuto.devMode) || "parallel") === "serial" ? "serial" : "parallel"; }
		function rmParallel() { return Math.min(4, Math.max(1, Number((state.rmAuto && state.rmAuto.parallel) || 2))); }
		function rmIncParallel() {
		  const p = Math.min(4, rmParallel() + 1);
		  state.rmAuto = Object.assign({}, state.rmAuto, { parallel: p, devMode: "parallel" });
		}
		function rmDecParallel() {
		  const p = Math.max(1, rmParallel() - 1);
		  state.rmAuto = Object.assign({}, state.rmAuto, { parallel: p, devMode: "parallel" });
		}
		function rmSetDevMode(m) {
		  state.rmAuto = Object.assign({}, state.rmAuto, { devMode: m, parallel: m === "serial" ? 1 : Math.min(4, Math.max(1, Number((state.rmAuto && state.rmAuto.parallel) || 2))) });
		}
	// 批量删除（roadmap.delete_batch 协议：node 侧跳过开发中条目；受理后广播刷新）。
	async function rmBatchDelete() {
	  const targets = state.rmItems.filter((x) => state.rmChecked.indexOf(x.id) >= 0 && rmIsTerminal(x));
	  const skip = state.rmChecked.length - targets.length;
	  if (!targets.length) {
	    showFailToast(skip ? "勾选中无终态条目（开发中不可删除）" : "请先勾选要删除的条目");
	    return;
	  }
	  try {
	    await showConfirmDialog({
	      title: "批量删除",
	      message: "将删除 " + targets.length + " 条条目" + (skip ? "（另有 " + skip + " 条开发中已跳过）" : "") + "，不可恢复。确认？",
	      confirmButtonColor: dialogColor("danger"),
	    });
	  } catch (e) { return; }
	  state.rmDelBatch = true;
	  try {
	    const res = await request("roadmap.delete_batch", { nodeId: state.rmNode, ids: targets.map((x) => x.id) }, 10000);
	    const p = (res && res.payload) || {};
	    if (res.type === "op.result" && p.ok) {
	      showSuccessToast("已删除 " + targets.length + " 条");
	      state.rmChecked = [];
	      state.rmBatchMode = false;
	      loadRoadmap();
	    } else {
	      showFailToast(p.message || "批量删除失败");
	    }
	  } finally {
	    state.rmDelBatch = false;
	  }
	}
	// 一键清理全部终态（已完成/失败/暂停/驳回），勾选全部终态后走 rmBatchDelete。
	function rmClearFinished() {
	  state.rmChecked = state.rmItems.filter((x) => rmIsTerminal(x)).map((x) => x.id);
	  state.rmBatchMode = true;
	  rmBatchDelete();
	}

	// 批量审核通过（roadmap.approve 协议：只置 approved 入排期，不立即开发；
	// 用户随后可点「执行」按钮勾选启动开发）。
	async function rmBatchApprove() {
	  const targets = state.rmItems.filter((x) => state.rmChecked.indexOf(x.id) >= 0 && x.status === "proposed");
	  if (!targets.length) {
	    showFailToast("请先勾选待审核的提案");
	    return;
	  }
	  try {
	    await showConfirmDialog({
	      title: "批量审核",
	      message: "将审核通过 " + targets.length + " 条提案（进入「已排期」，可随后点执行开发）。确认？",
	      confirmButtonColor: dialogColor("amber"),
	    });
	  } catch (e) { return; }
	  state.rmApproveBusy = true;
	  try {
	    const res = await request("roadmap.approve", { nodeId: state.rmNode, ids: targets.map((x) => x.id) }, 10000);
	    const p = (res && res.payload) || {};
	    if (res.type === "op.result" && p.ok) {
	      showSuccessToast("已审核通过 " + targets.length + " 条（已排期）");
	      state.rmChecked = [];
	      loadRoadmap();
	    } else {
	      showFailToast(p.message || "批量审核失败");
	    }
	  } finally {
	    state.rmApproveBusy = false;
	  }
	}

	// 完全自主开发弹层（提示词非必填 + 并发线程数默认 5 可改）。
		function openRmAuto() {
		  if (!state.rmNode) { showFailToast("暂无在线节点，无法开启完全自主"); return; }
		  state.rmAutoGuidance = "";
		  state.rmAutoParallel = 5;
		  state.rmAutoMinDev = 1;
		  state.showRmAuto = true;
		}
	function closeRmAuto() {
	  state.showRmAuto = false;
	  state.rmAutoGuidance = "";
	}
		// 确认开启完全自主（roadmap.auto 协议：节点自动规划 → AI 审核 → 并行开发；
		// minDeveloping 最低并行开发数：开发中低于该值时节点持续规划+审核补货）。
		async function rmAutoStart() {
		  if (state.rmAutoBusy) return;
		  state.rmAutoBusy = true;
		  try {
		    const res = await request("roadmap.auto", {
		      nodeId: state.rmNode,
		      guidance: (state.rmAutoGuidance || "").trim(),
		      parallel: Math.min(10, Math.max(1, Number(state.rmAutoParallel) || 5)),
		      minDeveloping: Math.min(10, Math.max(1, Number(state.rmAutoMinDev) || 1)),
		    }, 15000);
	    const p = (res && res.payload) || {};
	    if (res.type === "op.result" && p.ok) {
	      showSuccessToast("已开启完全自主开发，PC 端自动规划开发中…");
	      state.showRmAuto = false;
	      loadRoadmap();
	    } else {
	      showFailToast(p.message || "开启失败");
	    }
	  } finally {
	    state.rmAutoBusy = false;
	  }
	}

	// ---------- A2A 数字员工群聊（group.* 协议链路；节点为群状态权威） ----------
	// 链路：group.list（打开群列表）→ 服务端投影立即应答 + 在线节点 group.sync 拉权威快照
	// （agent.group_state → groups 广播覆盖）；发消息 group.msg → 节点记录历史 + 回传广播
	// group.message → 移动端实时追加。员工产出（群任务执行中 say 文本）同样走 group.message。
	// 拉取节点数字员工列表（建群时选成员；employee.list → employees 广播/应答）
	async function loadEmployees() {
	  state.employeesLoading = true;
	  try {
	    const res = await request("employee.list", {}, 10000);
	    const p = (res && res.payload) || {};
	    if (res.type === "employees" || (p && Array.isArray(p.employees))) {
	      state.employees = p.employees || [];
	    }
	  } catch (e) {} finally {
	    state.employeesLoading = false;
	  }
	}
	async function loadGroups() {
	  state.groupsLoading = true;
	  try {
	    const res = await request("group.list", {}, 10000);
	    const p = (res && res.payload) || {};
	    if (res.type === "groups" || (p && Array.isArray(p.groups))) {
	      state.groups = p.groups || [];
	    }
	  } catch (e) {} finally {
	    state.groupsLoading = false;
	  }
	}
	function openGroup(g) {
	  if (!g || !g.id) return;
	  state.groupCur = g;
	  state.groupMsgs = [];
	  state.groupInput = "";
	  activeTab.value = "group-chat";
	  loadGroupMessages(g.id);
	}
	async function loadGroupMessages(gid) {
	  try {
	    const res = await request("group.sync", { groupId: gid }, 10000);
	    const p = (res && res.payload) || {};
	    if (res.type === "group.state" || p) {
	      const g = (p.groups || [])[0];
	      if (g && state.groupCur && state.groupCur.id === gid) {
	        state.groupCur = g;
	      }
	      if (Array.isArray(p.messages)) {
	        state.groupMsgs = p.messages;
	        scrollGroupBottom(true);
	      }
	    }
	  } catch (e) {}
	}
	async function sendGroupMsg() {
	  const text = (state.groupInput || "").trim();
	  const gid = state.groupCur && state.groupCur.id;
	  if (!text || !gid) return;
	  const res = await request("group.msg", { groupId: gid, text }, 10000);
	  if (res.type === "op.result" && res.payload && res.payload.ok === false) {
	    showFailToast(res.payload.message || "发送失败");
	    return;
	  }
	  state.groupMsgs.push({ id: "local-" + Date.now(), groupId: gid, author: "user", authorName: state.displayName || state.user || "我", authorKind: "user", text, ts: Date.now() });
	  state.groupInput = "";
	  scrollGroupBottom(true);
	}
	function appendGroupMsg(m) {
	  if (!m || !m.groupId) return;
	  state.groupLast[m.groupId] = m; // 群列表 v5 最近消息预览（广播到达即缓存）
	  if (state.groupCur && state.groupCur.id === m.groupId) {
	    // 去重：乐观上屏的本地帧（author:user）与权威回传帧（author:user:remote）按
	    // 类型+文本匹配替换，避免同一消息渲染两次；权威帧带 ID 后作稳定键。
	    const isUser = m.authorKind === 'user';
	    const i = state.groupMsgs.findIndex((x) =>
	      (x.id && x.id === m.id) ||
	      (isUser && x.authorKind === 'user' && x.text === m.text) ||
	      (!isUser && x.author === m.author && x.text === m.text));
	    if (i >= 0) state.groupMsgs[i] = m;
	    else state.groupMsgs.push(m);
	    scrollGroupBottom(false);
	  }
	}
	function scrollGroupBottom() {
	  requestAnimationFrame(() => {
	    const el = document.getElementById("group-chat-body");
	    if (el) el.scrollTop = el.scrollHeight;
	  });
	}
	function backFromGroup() {
	  state.groupCur = null;
	  state.groupMsgs = [];
	  activeTab.value = "groups";
	  loadGroups();
	}
	// 群列表 v5 最近消息预览：优先本地广播缓存（groupLast），无则空提示。
	function groupLastMsg(g) {
	  if (!g || !g.id) return null;
	  if (state.groupLast && state.groupLast[g.id]) return state.groupLast[g.id];
	  return null;
	}
	// 群聊空态「向群里发言」：聚焦输入框（成员面板可能开着，先关掉）。
	function focusGroupInput() {
	  state.groupShowMembers = false;
	  setTimeout(() => {
	    const el = document.getElementById("group-input");
	    if (el) el.focus();
	  }, 60);
	}
	async function createGroup() {
	  const name = (state.groupNewName || "").trim();
	  if (!name) { showFailToast("请输入群名称"); return; }
	  try {
	    const res = await request("group.create", { name, members: state.groupNewMembers }, 12000);
	    const p = (res && res.payload) || {};
	    if (res.type === "op.result" && p.ok === false) {
	      showFailToast(p.message || "创建失败");
	      return;
	    }
	    state.groupShowCreate = false;
	    state.groupNewName = "";
	    state.groupNewMembers = [];
	    showSuccessToast("群聊创建已受理，PC 端建群中…");
	    setTimeout(loadGroups, 1500);
	  } catch (e) {}
	}
	function toggleGroupMember(id) {
	  const i = state.groupNewMembers.indexOf(id);
	  if (i >= 0) state.groupNewMembers.splice(i, 1);
	  else state.groupNewMembers.push(id);
	}

	// ---------- 群成员管理（移动端轻量：添加/移除数字员工） ----------
	// group.join / group.leave → 节点侧改成员 → agent.group_state 广播 → groups 覆盖。
	async function groupAddMember(eid) {
	  if (!state.groupCur || !eid) return;
	  const res = await request('group.join', { groupId: state.groupCur.id, agentId: eid }, 10000);

	// 可添加的员工：非归档 + 不在当前群内
	function groupAddable() {
	  const ids = ((state.groupCur && state.groupCur.members) || []).map((m) => m.id);
	  return state.employees.filter((e) => (e.status || e.Status) !== 'archived' && ids.indexOf(e.ID || e.id) < 0);
	}
	async function dispatchGroupTask() {
	  if (!state.groupCur || state.groupTaskBusy) return;
	  const text = (state.groupInput || "").trim();
	  if (!text) { showFailToast("请输入任务指令"); return; }
	  state.groupTaskBusy = true;
	  try {
		// mode 省略 = chain（接力，向后兼容；移动端轻量交互暂不提供模式选择）。
		const res = await request("group.task", { groupId: state.groupCur.id, instruction: text }, 12000);
	    const p = (res && res.payload) || {};
	    if (res.type === "op.result" && p.ok === false) {
	      showFailToast(p.message || "任务受理失败");
	      return;
	    }
	    state.groupInput = "";
	    showSuccessToast("任务已派发，员工协作中…");
	  } finally {
	    state.groupTaskBusy = false;
	  }
	}

	// tasks 推送到达时同步当前打开会话的状态徽标。
// 滞留态防御：若任务已推终态（done/failed/canceled）而新快照里没有此会话
//（任务被删/已被收会），不覆盖 —— 终态是最终事实；若新快照存在则无条件跟随
// 权威源（含节点失联收敛后的 failed），修复打开会话后状态不更新。
function syncCurrentStatus(list) {
  if (!state.currentSession) return;
  const t = list.find((x) => x.sessionId === state.currentSession);
  if (t) state.chatStatus = t.status;
  else if (["pending", "running"].includes(state.chatStatus)) state.chatStatus = "";
}

// ---------- 会话消息 ----------

// task.result 到达后的会话历史延迟重拉调度：
//  - 单一 pending 定时器（后续 result/task 切换重置窗口，防抖）；
//  - 触发时二次校验会话未切换，避免拿旧会话历史覆盖新页；
//  - 仅在用户正停留在该会话时拉取（openSessionChat 会主动拉历史，无需补拉）。
// turn_diff 文本 → 渲染模型（统计徽章 + 文件清单 + diff 行）。
// 后端格式见 internal/agent/turndiff.go summary：首行统计、"- path（状态），N 字节"
// 清单、"diff --kaelvoris a/path" 分隔的行级对比。返回 {stats, rows}，无内容返 null。
function parseTurnDiff(text) {
  const lines = String(text || "").split("\n");
  if (!lines.length || lines[0].indexOf("净摘要") < 0) return null;
  const stat = lines[0].match(/新建 (\d+) \/ 修改 (\d+) \/ 删除 (\d+)/);
  const stats = {
    created: stat ? Number(stat[1]) : 0,
    modified: stat ? Number(stat[2]) : 0,
    deleted: stat ? Number(stat[3]) : 0,
  };
  const rows = [];
  let inDiff = false;
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("diff --kaelvoris ")) {
      inDiff = true;
      rows.push({ t: "head", x: line.replace("diff --kaelvoris ", "") });
      continue;
    }
    if (inDiff) {
      const c = line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : "";
      rows.push({ t: "line", c, x: line });
      continue;
    }
    if (!line.trim()) continue;
    const c = line.includes("（新建）") ? "add" : line.includes("（修改）") ? "mod" : line.includes("（已删除）") ? "del" : "";
    rows.push({ t: "entry", c, x: line });
  }
  return { stats, rows };
}

let resultRefreshTimer = null;
function scheduleResultRefresh(sessionID) {
  if (!sessionID || sessionID !== state.currentSession) return;
  if (resultRefreshTimer) clearTimeout(resultRefreshTimer);
  resultRefreshTimer = setTimeout(() => {
    resultRefreshTimer = null;
    if (!sessionID || sessionID !== state.currentSession) return; // 已切走：丢弃
    request("get.messages", { sessionID });
  }, 600);
}

// ---------- 任务终态通知（用户不在该会话页时横幅提醒） ----------
// 场景：task.result 广播到达时，用户可能停在任务列表/别的会话 —— 无任何感知。
// 行为：
//  - 正查看该会话页：不打扰（页面本身已有终态卡片 + 600ms 后历史补全）；
//  - 2s 去重窗口：服务端 TaskDone 无防重，同一任务重复终态会连广播 2 次（B10 实测），
//    用 taskId+status 键合并，避免同内容横幅连弹两条；
//  - 横幅：Vant Notify 深色化（.gh-notify + 状态色边条，色彩即状态），点击跳转会话；
//  - 页面后台：额外发系统 Notification（权限缺失/被拒则静默跳过，页面内横幅仍兜底）。
let lastNotifyKey = "";
function notifyTaskResult(p) {
  if (!p || !p.taskId) return;
  const inSession = p.sessionId === state.currentSession;
  const status = p.canceled ? "canceled" : p.ok ? "done" : "failed";
  const key = p.taskId + ":" + status;
  const now = Date.now();
  // 去重窗口：2s 内同任务同终态只弹一次（迟到重复广播被吞）。
  if (key === lastNotifyKey && now - (notifyTaskResult._at || 0) < 2000) return;
  notifyTaskResult._at = now;
  lastNotifyKey = key;
  if (inSession) return; // 在会话页：页面内已有终态反馈，不弹横幅
  const t = p.task || state.tasks.find((x) => x.id === p.taskId);
  // 手动命名优先：PC 端右键改名的会话名随任务 Title 下发，通知标题跟随手动名
  const title = t ? (t.title || firstLine(t.text || "", 30)) : "任务";
  const lines = {
    done: "任务完成", failed: "任务失败", canceled: "任务已取消",
  };
  const msgText = (p.canceled ? (p.error || "已取消") : p.ok ? (p.result || "已完成") : (p.error || "执行失败"));
  // 横幅：状态色边条（成功青 / 失败红 / 取消灰蓝），色彩即状态无装饰色。
  const nid = showNotify({
    message: "[" + (lines[status] || "任务结束") + "] " + title,
    className: "gh-notify is-" + status,
    color: "var(--fg)",
    background: "var(--surface-warm)",
    duration: 4000,
    onClick: () => {
      closeNotify(nid);
      const tid = p.taskId;
      const tk = state.tasks.find((x) => x.id === tid) || t;
      if (tk && tk.sessionId) {
        openSessionChat(tk.sessionId, tk.id, tk.title || firstLine(tk.text || "", 40), tk.status);
      }
    },
  });
  // 页面后台（切走/锁屏）：系统通知增强；权限未授予时静默跳过（横幅已兜底）。
  if (document.hidden && "Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification("Kaelvoris · " + (lines[status] || "任务结束"), {
        body: title + (msgText ? "\n" + firstLine(msgText, 60) : ""),
        tag: key, // 同 tag 系统级去重
      });
      n.onclick = () => { try { window.focus(); n.close(); } catch (e) {} };
    } catch (e) { /* 通知失败不影响主流程 */ }
  }
}

	// ---------- 会话消息渲染（性能：稳定 id） ----------
	// 消息对象入列时统一带自增 id，模板 v-for 用 m.id 作 key（原先用数组下标）。
	// 下标 key 在头部插入/中间删除（如 dropAnalyzeLoading splice）时后续全部重渲染；
	// 稳定 id 让 Vue 精准复用未变气泡的 DOM/组件状态。
		let msgSeq = 1;
			function pushMsg(m) { m.id = "m" + (msgSeq++); if (!m.ts && m.ev) m.ts = m.ev.ts; state.messages.push(m); }

	function streamAppend(ev, evTs) {
	  if (ev.partial) {
		// 流式：更新/追加最后一条 bot 文本（服务端只推 text/reasoning 的 partial 帧）。
		if (ev.kind === "text") {
		  const last = state.messages[state.messages.length - 1];
		  if (last && last.role === "bot" && last.kind === "text" && last.streaming) {
			last.text = ev.text;
		  } else {
			pushMsg({ role: "bot", kind: "text", text: ev.text, streaming: true, ts: evTs });
		  }
		}
  } else {
	// 定型帧：清 streaming 标记。
	const last = state.messages[state.messages.length - 1];
	if (last && last.streaming) last.streaming = false;
			if (ev.kind === "started") {
		  pushMsg({ role: "user", kind: "user", text: ev.text || "", ts: evTs });
	} else if (ev.kind === "ask") {
	  // ask 由 state.ask 审批卡展示，不落消息流。
			} else if (ev.kind === "image") {
				// 生成图片帧（绘画/内生图）：Text 为 ImageEventPayload JSON（images/promt/spot）。
				let imgs = [];
				try { const pl = JSON.parse(ev.text || "{}"); imgs = pl.images || ev.images || []; } catch (e) { imgs = ev.images || []; }
					if (imgs.length) pushMsg({ role: "bot", kind: "image", images: imgs, ts: evTs });
					refreshMediaSigns(state.currentSession); // 实时图片帧：立即换取签名 URL
				} else if (ev.kind === "video" || ev.kind === "audio") {
				// 媒体帧（generate_video / generate_speech 远端回报）：Text 为
				// {kind, path, fileName, mime, url} 载荷，url 为服务端 /img/ 镜像地址
				//（无 url 时仅展示文件名卡）。
				let url = "", name = "";
				try {
					const pl = JSON.parse(ev.text || "{}");
					url = pl.url || (pl.images && pl.images[0]) || "";
					name = pl.fileName || "";
				} catch (e) { name = ev.text || ""; }
						pushMsg({ role: "bot", kind: ev.kind, url, name, ts: evTs });
						refreshMediaSigns(state.currentSession); // 实时媒体帧：立即换取签名 URL
				} else if (ev.text) {
	  const last2 = state.messages[state.messages.length - 1];
	  if (last2 && last2.role === "bot" && !last2.streaming && last2.text === ev.text) {
		// 历史回放与事件重复：跳过。
	  } else if (last2 && last2.role === "bot" && last2.kind === ev.kind && last2.text === ev.text) {
		// 同帧重复：跳过。
			} else if (ev.kind === "turn_diff") {
			// 任务完成文件变更摘要：折叠卡片（统计徽章 + 清单 + diff 行）。
			const td = parseTurnDiff(ev.text);
				if (td) pushMsg({ role: "bot", kind: "turn_diff", text: ev.text, tdStats: td.stats, tdRows: td.rows, tdOpen: false, ts: evTs });
			  } else if (ev.kind === "progress") {
				// 长任务心跳（R2 内核化）：每 N 轮请求一条进度提示，替代长时间静默。
				pushMsg({ role: "bot", kind: "progress", text: ev.text, ts: evTs });
			  } else {
			pushMsg({ role: "bot", kind: ev.kind || "text", text: ev.text, ts: evTs });
		  }
	}
  }
  scrollBottom(false);
}

	// 会话历史回放 → 渲染模型（role + kind 双维）
	function loadMessagesInto(raws) {
	  state.messages = [];
	  for (const raw of raws) {
		try {
		  const m = typeof raw === "string" ? JSON.parse(raw) : raw;
		  if (!m) continue;
		  if (m.partial && m.say !== "text" && m.say !== "reasoning") continue;
		  if (m.say === "api_req_started" || m.say === "api_req_finished" || m.say === "ai_context") continue;
		  if (m.say === "progress") continue; // 心跳不落历史，历史回放无需渲染
		  let role = "bot", kind = "text", text = m.text || "";
		  if (m.type === "ask") {
			kind = "ask";
		  } else if (m.say === "user_feedback") {
			role = "user"; kind = "user";
		  } else if (m.say === "tool") {
			kind = "tool";
			try {
			  const info = JSON.parse(m.text);
			  text = (info.tool || "tool") + (info.path ? "  →  " + info.path : "") + (info.cmd ? "  →  " + String(info.cmd).slice(0, 120) : "");
			} catch (e) { text = "tool"; }
		  } else if (m.say === "error") {
			kind = "error";
			  } else if (m.say === "video" || m.say === "audio") {
				// 会话历史中的视频/音频帧：text 为 MediaPayload JSON（服务端镜像存路径，
				// 移动端无本地盘）→ 尝试从任务 images（/img/ URL）回挂；无则展示文件名卡。
				let url = "", name = "";
				try {
					const pl = typeof m.text === "string" ? JSON.parse(m.text) : m.text;
					const list = Array.isArray(pl) ? pl : [];
					name = (list[0] && list[0].fileName) || "";
					const t = state.tasks.find((x) => x.sessionId === state.currentSession);
					if (t && (t.images || []).length) url = t.images[t.images.length - 1];
					else if (list.length && list[0].url) url = list[0].url;
				} catch (e) { /* 非 JSON：跳过 */ }
					pushMsg({ role: "bot", kind: m.say, url, name, ts: m.ts });
				continue;
			  } else if (m.say === "image") {
				// 会话历史中的图片帧：text 为 {path,fileName} JSON（服务端镜像存路径，
				// 移动端无本地盘）→ 尝试从任务 images（/img/ URL）回挂；无则跳过。
			let urls = [];
			try {
			  const pl = typeof m.text === "string" ? JSON.parse(m.text) : m.text;
			  const list = Array.isArray(pl) ? pl : [];
			  const t = state.tasks.find((x) => x.sessionId === state.currentSession);
			  if (t && (t.images || []).length) urls = t.images;
			  else if (list.length && list[0].url) urls = list.map((x) => x.url);
			} catch (e) { /* 非 JSON：跳过 */ }
				if (urls.length) pushMsg({ role: "bot", kind: "image", images: urls, ts: m.ts });
			continue;
		  }
		  if (!text) continue;
			if (m.say === "turn_diff") {
			  const td = parseTurnDiff(text);
				if (td) pushMsg({ role: "bot", kind: "turn_diff", text, tdStats: td.stats, tdRows: td.rows, tdOpen: false, ts: m.ts });
			  continue;
			}
			// say=image 帧已 continue 处理（不含 text 的路径载荷不落普通气泡）。
			if (kind === "image") continue;
			  pushMsg({ role, kind, text, ts: m.ts });
		} catch (e) { /* skip */ }
	  }
	  scrollBottom(true);
	}

// ---------- 登录 / 退出 ----------
function doLogin() {
  const user = (state.loginUser || "").trim();
  const pass = state.loginPass || "";

							    openRmDetail, closeRmDetail, rmCardSub, rmSourceText, rmStatusTabs, rmDevMode, rmParallel, rmIncParallel, rmDecParallel, rmSetDevMode, rmClearFinished, rmIsTerminal,
			        refresh, verifyTasks, statusText, toggleFilter, fmtTime, fmtDur, firstLine, stripAnalyzePrefix,
	        // UX Plus（体验增强）
					        filteredTasks, filteredSessions, filteredPaints, paintCountBySpot, paintInfo,

	  if (inShell) {

<script type="text/x-template" id="tpl-app">
<div>

  <!-- ═══════════ 登录页（统一账号：PC/移动互通） ═══════════ -->

      <span class="sig" :class="s.wsOnline ? 'on' : 'off'"><i></i><i></i><i></i><i></i></span>

      <div class="hdr-title">Kaelvoris<span class="hdr-sub">Mission Control</span></div>

        <span class="sig" :class="s.wsOnline ? 'on' : 'off'"><i></i><i></i><i></i><i></i></span>

    <!-- ═══════════ 任务页 ═══════════ -->
    <div v-show="activeTab === 'tasks'" class="page">

			      </div>
			      <!-- 搜索框：三视图共用（placeholder 随视图切换） -->
			      <div class="search-wrap">
			        <span class="van-icon van-icon-search"></span>
			        <input class="search-inp" v-model="s.searchQuery" :placeholder="s.taskView==='sessions' ? '搜索会话标题' : (s.taskView==='paint' ? '搜索绘画标题 / 提示词' : '搜索任务 / 结果摘要')" autocapitalize="off" autocorrect="off">
			        <span v-if="(s.taskView==='sessions' ? s.sessQuery : (s.taskView==='paint' ? s.paintQuery : s.taskQuery))" class="search-clear" @click="s.taskView==='sessions' ? s.sessQuery='' : (s.taskView==='paint' ? s.paintQuery='' : s.taskQuery='')">✕</span>
			      </div>
		      <!-- 景点筛选行：仅绘画视图显示（过滤绘画列表；空 = 全部景点；从绘画任务的 spot 字段动态聚合） -->
		      <div class="filter-row" v-if="s.taskView==='paint'">
		        <span class="fchip fchip-node" :class="{on: s.filterSpot===''}" @click="s.filterSpot=''">@全部景点</span>
		        <span v-for="sp in spotsC" :key="sp" class="fchip fchip-node" :class="{on: s.filterSpot===sp}" @click="s.filterSpot = s.filterSpot===sp ? '' : sp">@{{ sp }} <span v-if="paintCountBySpot(sp)">{{ paintCountBySpot(sp) }}</span></span>
		      </div>
			      <!-- 筛选行：任务视图 = 状态 chips + 节点 chips；会话视图隐藏 -->
			      <div class="filter-row" v-if="s.taskView==='tasks'">
				        <span class="fchip" :class="{on: s.filter==='all'}" @click="s.filter='all'">全部 <span v-if="s.tasks.length">{{ s.tasks.length }}</span></span>
				        <span class="fchip" :class="{on: s.filter==='running'}" @click="s.filter='running'">运行中 <span v-if="taskStatusCounts.running">{{ taskStatusCounts.running }}</span></span>
				        <span class="fchip" :class="{on: s.filter==='pending'}" @click="s.filter='pending'">待执行 <span v-if="taskStatusCounts.pending">{{ taskStatusCounts.pending }}</span></span>
				        <span class="fchip" :class="{on: s.filter==='done'}" @click="s.filter='done'">已完成 <span v-if="taskStatusCounts.done">{{ taskStatusCounts.done }}</span></span>
				        <span class="fchip" :class="{on: s.filter==='failed'}" @click="s.filter='failed'">失败 <span v-if="taskStatusCounts.failed">{{ taskStatusCounts.failed }}</span></span>
		        <template v-if="s.nodes.length">
		          <span class="fchip fchip-node" :class="{on: s.filterNode===''}" @click="s.filterNode=''">@全部节点</span>
		          <span v-for="n in s.nodes" :key="n.id" class="fchip fchip-node" :class="{on: s.filterNode===n.id}" @click="s.filterNode = s.filterNode===n.id ? '' : n.id">@{{ n.name }} <span v-if="taskCountByNode(n.id)">{{ taskCountByNode(n.id) }}</span></span>
		        </template>
		      </div>
		      <van-pull-refresh v-model="s.refreshing" @refresh="refresh" style="min-height:64vh">
		      <!-- ── 任务列表视图 ── -->
		      <template v-if="s.taskView==='tasks'">
			        <!-- 首载骨架屏：首个 tasks 推送到达前显示脉冲占位（消除白屏等待感） -->
			        <template v-if="s.tasksLoading && !s.tasks.length">
			          <div class="sk" v-for="i in 4" :key="'sk'+i"><i></i><i></i><i></i></div>
			        </template>
			        <div v-else-if="!s.tasks.length" style="padding-top:14vh">
			          <van-empty description="还没有远程任务"></van-empty>
			          <div style="text-align:center;margin-top:-6vh">
			            <button class="empty-cta" @click="s.showNew = true">+ 发布第一个任务</button>
			          </div>
			        </div>
			        <div v-else-if="s.taskQuery && !filteredTasks.length" class="no-result">无匹配任务 · 换个关键词试试</div>
			<!-- 任务卡左滑操作：终态任务 → 重试（failed/canceled）+ 删除记录（done/failed/canceled）；
			             运行中/待执行仅给重试入口（failed 语义对齐，先取消再重试更直接）。 -->
			        <template v-else>
			        <van-swipe-cell v-for="(t, idx) in filteredTasks" :key="t.id" v-show="s.filter==='all' || s.filter===t.status" :style="{'--i': idx}">
		          <template #right>
		            <div class="swipe-btns">
		              <button v-if="t.status==='failed' || t.status==='canceled'" class="swipe-retry" @click.stop="retryTask(t)"><span class="van-icon van-icon-replay"></span>重试</button>
		              <button v-if="deletable(t)" class="swipe-del" @click.stop="removeTask(t)"><span class="van-icon van-icon-delete-o"></span>删除</button>
		            </div>
		          </template>
		          <div class="tcard" :class="'st-'+t.status" @click="openTask(t)">
		            <div class="tcard-top">
		              <div class="tcard-text">{{ firstLine(t.text, 80) }}</div>
		              <span class="st-dot" :class="'sd-'+t.status"></span>
		            </div>
		            <div class="tcard-meta">
		              <span class="st-chip st-chip-btn" :class="['sc-'+t.status, {sel: s.filter===t.status}]" @click.stop="toggleFilter(t.status)">{{ statusText(t.status) }}</span>
		              <button v-if="nodeName(t.nodeId)" class="node-chip" :class="{sel: s.filterNode===t.nodeId}" @click.stop="s.filterNode = s.filterNode===t.nodeId ? '' : t.nodeId">@{{ nodeName(t.nodeId) }}</button>
		              <span v-if="t.mode" class="mode-chip">{{ t.mode }}</span>
		              <span class="t-time">{{ fmtTime(t.createdAt) }}</span>
		              <span v-if="t.createdBy" class="t-by">{{ t.createdBy }}</span>
		              <span v-if="t.status==='running'" class="t-dur" style="color:var(--data-cyan)">{{ fmtDur(t) }}</span>
		            </div>
		            <div v-if="t.result || t.error" class="tcard-sum" :class="{err: t.status==='failed'}">{{ t.status==='failed' ? '⚠ ' : '' }}{{ firstLine(t.result || t.error, 90) }}</div>
			          </div>
			        </van-swipe-cell>
			        </template>
			      </template>
		      <template v-else-if="s.taskView==='paint'">
		        <!-- ── 绘画作品视图（真实数据：kind=paint 任务；生成图 /img/ 缩略图；景点 chips 过滤） ── -->
		        <template v-if="s.paintQuery && !filteredPaints.length">
		          <div class="no-result">无匹配作品 · 换个关键词试试</div>
		        </template>
		        <div v-else-if="!filteredPaints.length" style="padding-top:10vh">
		          <van-empty :description="s.filterSpot ? '该景点暂无作品' : '还没有绘画作品 · 点右下角 + 开始创作'"></van-empty>
		        </div>
		        <div v-for="(p, pidx) in filteredPaints" :key="p.id" class="tcard pcard" :class="'st-'+p.status" :style="{'--i': pidx}" @click="paintInfo(p)">

		          <div v-else-if="p.status==='running' || p.status==='pending'" class="pcard-ph">

		          </div>
		          <div class="tcard-top">
		            <div class="tcard-text"><span class="paint-ico">🎨</span>{{ firstLine(p.text, 46) }}</div>
		            <span class="st-dot" :class="'sd-'+p.status"></span>
		          </div>
		          <div class="tcard-meta">
		            <span class="st-chip" :class="'sc-'+p.status">{{ statusText(p.status) }}</span>
		            <button v-if="p.spot" class="node-chip spot-chip" @click.stop="s.filterSpot = s.filterSpot===p.spot ? '' : p.spot">@{{ p.spot }}</button>
		            <span class="t-time">{{ fmtTime(p.createdAt) }}</span>
		            <span v-if="p.status==='running'" class="t-dur" style="color:var(--data-cyan)">{{ fmtDur(p) }} 生成中</span>

		          <div class="tcard-sum">{{ firstLine(p.text, 76) }}</div>
		        </div>
		      </template>
	      <template v-else>
	        <!-- 清理入口 + 最近一次清理结果卡（cleanup.done 广播渲染；可关闭） -->

            <button class="cleanup-btn" :disabled="s.cleanupBusy || s.clearBusy" @click="cleanupSessions">{{ s.cleanupBusy ? '⏳ 清理中…' : '🧹 清理' }}</button>
            <button class="cleanup-btn ca-sum" :disabled="s.cleanupBusy || s.clearBusy" @click="summarizeClearTasks">{{ s.clearBusyText==='汇总中…' ? '⏳ 汇总中…' : '📝 总结并清理' }}</button>
            <button class="cleanup-btn ca-danger" :disabled="s.cleanupBusy || s.clearBusy" @click="clearAllTasks">{{ s.clearBusyText==='清空中…' ? '⏳ 清空中…' : '🗑 清空' }}</button>

			        <van-action-sheet

	    <button v-show="activeTab==='tasks'" class="fab-verify" :class="{busy: s.verifyBusy}" :style="fabVerifyStyle" title="核实任务状态"

		        <div class="sheet-title">选择动作</div>

		        <div class="fab-menu-opt" @click="fabMenuPick('ai')">
		          <span class="van-icon van-icon-todo-list-o" style="font-size:20px;color:var(--data-amber)"></span>

		            <div class="fmo-name">AI 自主开发</div>
		            <div class="fmo-desc">进入 AR 规划板：AI 提案 → 勾选 → 执行开发</div>
		          </div>
		          <span class="van-icon van-icon-arrow" style="font-size:12px;color:var(--muted)"></span>

			        <div class="fab-menu-opt" @click="fabMenuPick('plan')">
				          <span class="van-icon van-icon-bulb-o" style="font-size:20px;color:var(--warn)"></span>
				          <div class="fmo-main">
				            <div class="fmo-name">AI 规划</div>
				            <div class="fmo-desc">AI 分析项目产出开发提案，自动同步到开发面板</div>
				          </div>
				          <span class="van-icon van-icon-arrow" style="font-size:12px;color:var(--muted)"></span>

        <div class="node-picker">
          <span class="np-item" :class="{on: s.newNode===''}" @click="s.newNode=''; s.newMode=''">自动选择</span>
          <span v-for="n in s.nodes.filter(n => n.online)" :key="n.id" class="np-item" :class="{on: s.newNode===n.id}" @click="s.newNode=n.id; s.newMode=''">{{ n.name }}</span>
          <span v-if="!s.nodes.some(n => n.online)" class="np-item" style="opacity:.5">暂无在线节点</span>
        </div>
        <div class="sheet-label">执行模式</div>
        <div class="node-picker">
          <span class="np-item" :class="{on: s.newMode===''}" @click="s.newMode=''">节点当前模式</span>
          <span v-for="m in targetModes()" :key="m.slug" class="np-item" :class="{on: s.newMode===m.slug}" @click="s.newMode=m.slug">{{ m.name || m.slug }}</span>
        </div>
        <textarea class="task-input" v-model="s.newText" maxlength="2000" placeholder="描述任务，例如：检查项目编译错误并修复"></textarea>
        <div class="sheet-btns">
          <button class="btn-ghost" @click="s.showNew=false">取消</button>
          <button class="btn-primary" @click="createTask">发布任务</button>
        </div>
      </div>
    </van-popup>

	    <!-- 发布绘画弹层（kind=paint 任务：PC 端 generate_image 生图 → 图片回传移动端） -->
	    <van-popup v-model:show="s.showPaintNew" position="bottom" round :style="{background:'var(--surface)'}">
	      <div class="sheet">
	        <div class="sheet-title">🎨 发布绘画</div>
	        <div class="sheet-sub">PC 端画图 API 生成，完成后图片自动回传此处</div>
	        <div class="sheet-label">景点 / 主题（可选）</div>
	        <div class="node-picker">
	          <span v-for="sp in paintSpotChips()" :key="sp" class="np-item" :class="{on: s.paintSpot===sp}" @click="pickPaintSpot(sp)">{{ sp }}</span>
	        </div>
	        <input class="cfg-inp mono" style="margin-top:8px" v-model="s.paintCustom" placeholder="自定义景点/主题（选中上方可留空）" autocapitalize="off" autocorrect="off" spellcheck="false">
	        <div class="sheet-label">画面描述</div>
	        <textarea class="task-input" v-model="s.paintText" maxlength="1000" placeholder="描述想画的画面，例如：雪后断桥，湖面薄雾，水墨淡彩风格，远山如黛"></textarea>
	        <div class="sheet-btns">
	          <button class="btn-ghost" @click="s.showPaintNew=false">取消</button>
	          <button class="btn-primary" :disabled="s.paintBusy" @click="publishPaint">{{ s.paintBusy ? '发布中…' : '开始生成' }}</button>
	        </div>
	      </div>
	    </van-popup>

	    <!-- 模式切换弹层 -->
    <van-popup v-model:show="s.showModePicker" position="bottom" round :style="{background:'var(--surface)'}">
      <div class="sheet">
        <div class="sheet-title">切换执行模式</div>
        <div class="sheet-sub">{{ s.modeTargetNode && s.modeTargetNode.name }} · 当前 {{ s.modeTargetNode ? modeName(s.modeTargetNode, s.modeTargetNode.mode) : '-' }}</div>
        <div v-for="m in nodeModes(s.modeTargetNode)" :key="m.slug" class="mode-opt" :class="{on: s.modeTarget===m.slug}" @click="s.modeTarget=m.slug">
          <div style="min-width:0">
            <div class="mo-name">{{ m.name || m.slug }}</div>
            <div class="mo-desc" v-if="m.description">{{ m.description }}</div>
          </div>
          <span class="radio" :class="{on: s.modeTarget===m.slug}"></span>
        </div>
        <div v-if="!nodeModes(s.modeTargetNode).length" class="sheet-sub">该节点未上报可选模式（旧版 PC 端）</div>
        <div class="sheet-btns">
          <button class="btn-ghost" @click="s.showModePicker=false">取消</button>
          <button class="btn-primary" @click="applyMode">确认切换</button>
        </div>
      </div>
    </van-popup>

    <!-- 节点设置弹层（PC 端 desktop.json 远端可见子集：模型/密钥/自动批准/上下文） -->
    <van-popup v-model:show="s.showCfg" position="bottom" round :style="{background:'var(--surface)'}">
      <div class="sheet">
        <div class="sheet-title">节点设置</div>
        <div class="sheet-sub">{{ s.cfgNode && s.cfgNode.name }} · 修改后立即生效（PC 端合并保存，Workspace 等本机字段不受影响）</div>
        <div v-if="s.cfgLoading" style="padding:30px 0;text-align:center;color:var(--muted);font-size:12px">加载中…</div>
        <template v-else>
          <div class="sheet-label">API Base URL</div>
          <input class="cfg-inp mono" v-model="s.cfgForm.baseURL" placeholder="https://api.example.com/v1" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="sheet-label">模型</div>
          <input class="cfg-inp mono" v-model="s.cfgForm.model" placeholder="claude-sonnet-4-5 / gpt-5.2 …" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="sheet-label">API Key</div>
          <input class="cfg-inp mono" v-model="s.cfgForm.apiKey" type="password" placeholder="留空 = 保持不变" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="sheet-hint">密钥仅在 PC 节点本地解密使用，远端只见掩码（如 sk-****abcd）；留空不修改</div>
          <div class="cfg-row" @click="s.cfgForm.autoApprove = !s.cfgForm.autoApprove">
            <div style="min-width:0">
              <div class="cfg-row-name">自动批准</div>
              <div class="cfg-row-desc">免确认自动执行工具调用（YOLO）</div>
            </div>
            <span class="cfg-switch" :class="{on: s.cfgForm.autoApprove}"><i></i></span>
          </div>
          <div class="cfg-row2">
            <div style="flex:1">
              <div class="cfg-row-name">上下文窗口</div>
              <div class="mo-desc">tokens；留空 = 模型默认</div>
            </div>
            <input class="cfg-inp mono" style="width:110px;flex:none" v-model="s.cfgForm.contextWindow" inputmode="numeric" placeholder="自动">
          </div>
	          <div class="cfg-row2">
	            <div style="flex:1">
	              <div class="cfg-row-name">自动压缩阈值</div>
	              <div class="mo-desc">上下文占比达到后触发历史压缩（%）</div>
	            </div>
	            <input class="cfg-inp mono" style="width:110px;flex-shrink:0" v-model="s.cfgForm.autoCondensePercent" inputmode="numeric" placeholder="默认">
	          </div>
		          <div class="sheet-label" style="margin-top:10px;color:var(--data-amber)">🎨 功能模型（图像 · 视频 · 语音，留空 = 不启用）</div>
		          <div class="sheet-label">画图 Base URL</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.imageGenBaseURL" placeholder="https://api.example.com/v1（OpenAI images 兼容）" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label">画图模型</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.imageGenModel" placeholder="gpt-image-1 / dall-e-3 / gemini-2.5-flash-image" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label">画图 API Key</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.imageGenAPIKey" type="password" placeholder="留空 = 保持不变" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label" style="margin-top:8px">视频 Base URL</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.videoGenBaseURL" placeholder="https://api.example.com/v1（OpenAI videos 兼容）" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label">视频模型</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.videoGenModel" placeholder="sora-2 / veo-3 / kling-v2" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label">视频 API Key</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.videoGenAPIKey" type="password" placeholder="留空 = 保持不变" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label" style="margin-top:8px">语音合成 Base URL（TTS）</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.speechBaseURL" placeholder="https://api.example.com/v1（OpenAI audio/speech 兼容）" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="sheet-label">语音模型</div>
		          <input class="cfg-inp mono" v-model="s.cfgForm.speechModel" placeholder="tts-1 / tts-1-hd / gpt-4o-mini-tts" autocapitalize="off" autocorrect="off" spellcheck="false">
		          <div class="cfg-row2">
		            <div style="flex:1">
		              <div class="cfg-row-name">语音 API Key</div>
		              <div class="mo-desc">留空 = 保持不变</div>
		            </div>
		            <input class="cfg-inp mono" style="width:130px;flex-shrink:0" v-model="s.cfgForm.speechAPIKey" type="password" placeholder="留空不变" autocapitalize="off" autocorrect="off" spellcheck="false">
		          </div>
		          <div class="cfg-row2">
		            <div style="flex:1">
		              <div class="cfg-row-name">默认音色</div>
		              <div class="mo-desc">alloy / nova / echo…（空 = 服务端默认）</div>
		            </div>
		            <input class="cfg-inp mono" style="width:130px;flex-shrink:0" v-model="s.cfgForm.speechVoice" placeholder="空 = 默认" autocapitalize="off" autocorrect="off" spellcheck="false">
		          </div>
        </template>
        <div class="sheet-btns">
          <button class="btn-ghost" @click="s.showCfg=false">取消</button>
          <button class="btn-primary" :disabled="s.cfgLoading || s.cfgSaving" @click="saveNodeCfg">{{ s.cfgSaving ? "保存中…" : "保存配置" }}</button>
        </div>
      </div>
    </van-popup>

	    <!-- 会话重命名弹层（长按菜单 → 重命名；rename.session 写服务端 Task.Title，全端同步） -->
	    <van-popup v-model:show="s.showSessRename" position="bottom" round :style="{background:'var(--surface)'}">
	      <div class="sheet">
	        <div class="sheet-title">重命名会话</div>
	        <div class="sheet-sub">名称同步到 PC 端与全部在线设备</div>
	        <input class="cfg-inp" style="margin-top:8px" v-model="s.sessRenameVal" placeholder="输入新名称" maxlength="80" autocapitalize="off" autocorrect="off" spellcheck="false" @keydown.enter="commitSessRename">
	        <div class="sheet-btns">
	          <button class="btn-ghost" @click="s.showSessRename=false">取消</button>
	          <button class="btn-primary" @click="commitSessRename">保存</button>
	        </div>
	      </div>
	    </van-popup>

	    <!-- 新建知识库文档弹层 -->
	    <van-popup v-model:show="s.showDocNew" position="bottom" round :style="{background:'var(--surface)'}">
      <div class="sheet">
        <div class="sheet-title">新建知识库文档</div>
        <div class="sheet-sub">文件名将做安全校验（仅 .md/.markdown/.txt，单层目录）</div>
        <input class="cfg-inp mono" v-model="s.docNewName" placeholder="例如：运维手册.md" autocapitalize="off" autocorrect="off" spellcheck="false" @keydown.enter="createDoc">
        <div class="sheet-btns">
          <button class="btn-ghost" @click="s.showDocNew=false">取消</button>
          <button class="btn-primary" @click="createDoc">创建</button>
        </div>
      </div>
    </van-popup>

  </template>
</div>
</script>
</body>
</html>
